name: Qualified candidate native runtime
description: Build the pinned Linux Methods library and DAG Python extension and CLI.

runs:
  using: composite
  steps:
    - name: Checkout qualified Methods source
      uses: actions/checkout@v6
      with:
        repository: GBeurier/nirs4all-methods
        ref: d5a63020a0912d645b06a65c5e0b322b0c3931b5
        path: nirs4all-methods-src

    - name: Checkout qualified DAG source
      uses: actions/checkout@v6
      with:
        repository: GBeurier/dag-ml
        ref: bdd89abcccf98eec558390fd4d8187b525b6f9af
        path: dag-ml-cli-src

    - uses: dtolnay/rust-toolchain@stable

    - name: Build fresh DAG Python extension and CLI
      shell: bash
      run: |
        python -m pip install 'maturin>=1.13,<2'
        python -m maturin build --locked --release \
          --manifest-path dag-ml-cli-src/crates/dag-ml-py/Cargo.toml \
          --interpreter python --out "$RUNNER_TEMP/nirs4all-candidate-dag-wheels"
        python -m pip install --no-deps --force-reinstall \
          "$RUNNER_TEMP"/nirs4all-candidate-dag-wheels/dag_ml-*.whl
        cargo build --locked -p dag-ml-cli --manifest-path dag-ml-cli-src/Cargo.toml

    - name: Build qualified Methods native library
      shell: bash
      working-directory: nirs4all-methods-src
      run: |
        cmake --preset dev-release
        cmake --build --preset dev-release --target n4m_c --parallel 2

    - name: Select canonical Methods binding and native runtime
      shell: bash
      run: |
        # bindings/python/pyproject.toml packages slim pls4all only. Transport
        # the canonical full n4m source directly, retaining the SDK origin.
        printf 'PYTHONPATH=%s\n' "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/nirs4all-methods-src/bindings/python/src${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
        printf 'N4M_LIB_PATH=%s\n' "$GITHUB_WORKSPACE/nirs4all-methods-src/build/dev-release/cpp/src/libn4m.so" >> "$GITHUB_ENV"
        printf 'NIRS4ALL_CORE_LIVE_METHODS_LIBRARY=%s\n' "$GITHUB_WORKSPACE/nirs4all-methods-src/build/dev-release/cpp/src/libn4m.so" >> "$GITHUB_ENV"
        printf 'N4A_DAGML_CLI=%s\n' "$GITHUB_WORKSPACE/dag-ml-cli-src/target/debug/dag-ml-cli" >> "$GITHUB_ENV"

    - name: Require qualified binding, library, extension and SDK origins
      shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import os
        from importlib.metadata import version
        from pathlib import Path
        import dag_ml
        import dag_ml._dag_ml as native
        import dag_ml.multimodal_methods as controller
        import dag_ml.multimodal_topology as topology_controller
        import n4m
        from n4m.roles import RolePipeline
        import nirs4all

        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        methods = workspace / 'nirs4all-methods-src'
        dag = workspace / 'dag-ml-cli-src'
        library = methods / 'build/dev-release/cpp/src/libn4m.so'
        assert Path(nirs4all.__file__).resolve() == workspace / 'nirs4all/__init__.py'
        assert Path(n4m.__file__).resolve() == methods / 'bindings/python/src/n4m/__init__.py'
        assert Path(n4m.library_path()).resolve() == library.resolve()
        assert library.is_file() and n4m.abi_version() == (2, 16, 0)
        assert callable(n4m.MultimodalPipeline)
        assert callable(RolePipeline.close)
        assert version('dag-ml') == dag_ml.version() == '0.3.32'
        assert 'site-packages' in Path(native.__file__).resolve().parts
        assert callable(dag_ml.prepare_host_hpo_structural_catalogue)
        assert callable(dag_ml.prepare_host_hpo_topology_catalogue)
        source = dag / 'crates/dag-ml-py/python/dag_ml/multimodal_methods.py'
        assert Path(controller.__file__).read_bytes() == source.read_bytes()
        topology_source = dag / 'crates/dag-ml-py/python/dag_ml/multimodal_topology.py'
        assert Path(topology_controller.__file__).read_bytes() == topology_source.read_bytes()
        cli = Path(os.environ['N4A_DAGML_CLI'])
        assert cli == dag / 'target/debug/dag-ml-cli' and os.access(cli, os.X_OK)
        print('SDK source:', nirs4all.__file__)
        print('Methods source:', n4m.__file__, 'ABI:', n4m.abi_version())
        print('Methods library:', library, 'SHA256:', hashlib.sha256(library.read_bytes()).hexdigest())
        print('DAG:', dag_ml.version(), 'extension:', native.__file__, 'CLI:', cli)
        PY
