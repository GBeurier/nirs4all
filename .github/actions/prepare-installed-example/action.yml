name: Prepare installed SDK archive replay
description: Install the tag wheel and exact public upstreams in an isolated interpreter for mandatory U07 replay.

runs:
  using: composite
  steps:
    - name: Prepare and prove the installed archive replay interpreter
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
        OMP_NUM_THREADS: '1'
        OPENBLAS_NUM_THREADS: '1'
        MKL_NUM_THREADS: '1'
      run: |
        python -B "$GITHUB_ACTION_PATH/../../../scripts/prepare_installed_example_runtime.py" \
          --workspace "$GITHUB_WORKSPACE" \
          --output "$RUNNER_TEMP/nirs4all-installed-example" \
          --github-env "$GITHUB_ENV"
