name: Prepare the native Octave archive example
description: Build MEX shims and capture real public Methods/DAG WASM fits for U15.

runs:
  using: composite
  steps:
    - name: Checkout the isolated Octave hydration helper
      uses: actions/checkout@v6
      with:
        repository: GBeurier/dag-ml
        ref: 337522ee9627f48f54a51aa00120c4b85d733a8b
        path: .octave-example-dag-helper
        # The preparation guard compares this commit with the qualified runtime.
        fetch-depth: 0

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install the documented Ubuntu Octave toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y octave octave-dev

    - name: Prepare native runtimes and the four-source capture
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
        OMP_NUM_THREADS: '1'
        OPENBLAS_NUM_THREADS: '1'
        MKL_NUM_THREADS: '1'
        CARGO_BUILD_JOBS: '2'
      run: |
        python -B "$GITHUB_ACTION_PATH/../../../scripts/prepare_octave_example_runtime.py" \
          --workspace "$GITHUB_WORKSPACE" \
          --dag-root "$GITHUB_WORKSPACE/.octave-example-dag-helper" \
          --output "$RUNNER_TEMP/nirs4all-octave-example" \
          --octave "$(command -v octave-cli)" \
          --github-env "$GITHUB_ENV"
