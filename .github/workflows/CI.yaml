# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, master, 'rc/**' ]
  pull_request:
    branches: [ main, master, 'rc/**' ]

# The default gate deliberately runs one complete Linux/Python suite. Platform
# smoke checks belong in dedicated workflows; duplicating the scientific suite
# across an OS/Python matrix makes failures slower and less actionable.

env:
  N4A_DAG_ML_REF: 053b9b8af17b4c78745a4db35ab8c3f4b01c6a4a
  N4A_DAG_ML_DATA_REF: ffe533704a1a0b0c7bb7d97a997caade3f4ba36e

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # RC branch: dag-ml wheels are selected by the release lock but are not
          # published to PyPI yet, so satisfy nirs4all's hard runtime dependency
          # from the selected GitHub refs before reading requirements-test.txt.
          python -m pip install \
            "dag-ml @ git+https://github.com/GBeurier/dag-ml.git@${N4A_DAG_ML_REF}#subdirectory=crates/dag-ml-py" \
            "dag-ml-data @ git+https://github.com/GBeurier/dag-ml-data.git@${N4A_DAG_ML_DATA_REF}#subdirectory=crates/dag-ml-data-py"
          python -m pip install numpy -r requirements-test.txt
          python -m pip install -e . --no-deps
          python -m pip install mypy types-PyYAML

      - name: Run mypy
        run: mypy nirs4all

  tests:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned dag-ml CLI source
        uses: actions/checkout@v6
        with:
          repository: GBeurier/dag-ml
          ref: 053b9b8af17b4c78745a4db35ab8c3f4b01c6a4a
          path: dag-ml-cli-src

      - uses: dtolnay/rust-toolchain@stable

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # RC branch: dag-ml wheels are selected by the release lock but are not
          # published to PyPI yet, so satisfy nirs4all's hard runtime dependency
          # from the selected GitHub refs before reading requirements-test.txt.
          python -m pip install \
            "dag-ml @ git+https://github.com/GBeurier/dag-ml.git@${N4A_DAG_ML_REF}#subdirectory=crates/dag-ml-py" \
            "dag-ml-data @ git+https://github.com/GBeurier/dag-ml-data.git@${N4A_DAG_ML_DATA_REF}#subdirectory=crates/dag-ml-data-py"
          # PyPI's Linux wheel pulls CUDA/Triton dependencies even on the CPU
          # runner. The official CPU wheel avoids that unstable runtime.
          grep -v '^torch' requirements-test.txt > requirements-test-filtered.txt
          python -m pip install numpy -r requirements-test-filtered.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.13.0+cpu'
          python -m pip install -r requirements-examples.txt

      - name: Install package (editable, no-deps — deps already from requirements-test.txt)
        run: python -m pip install -e . --no-deps

      - name: Build pinned dag-ml CLI for parity tests
        run: cargo build -p dag-ml-cli --manifest-path dag-ml-cli-src/Cargo.toml

      - name: Gate real library usability
        timeout-minutes: 5
        uses: ./.github/actions/library-usability

      - name: Run every pytest module under DAG-ML
        shell: bash
        env:
          N4A_ENGINE: dag-ml
          N4A_DAGML_CLI: ${{ github.workspace }}/dag-ml-cli-src/target/debug/dag-ml-cli
        run: python scripts/ci/run_full_dagml_pytest.py --report-dir dagml-pytest-report

      - name: Upload DAG-ML pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dagml-pytest-report
          path: dagml-pytest-report/
          if-no-files-found: warn

      - name: Run all examples once
        run: |
          cd examples
          chmod +x run_ci_examples.sh
          ./run_ci_examples.sh -c all -j 2 -k
        timeout-minutes: 45
