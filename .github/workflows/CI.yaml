# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, master, 'rc/**' ]
  pull_request:
    branches: [ main, master, 'rc/**' ]

# Note: Full tests with coverage run in publish.yml before PyPI release
# This workflow runs quick tests for regular development

env:
  N4A_DAG_ML_REF: 233d4ecdae14d2a810f9b01b4ce7c15bdedc9d27
  N4A_DAG_ML_DATA_REF: ffe533704a1a0b0c7bb7d97a997caade3f4ba36e

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # RC branch: dag-ml wheels are selected by the release lock but are not
          # published to PyPI yet, so satisfy nirs4all's hard runtime dependency
          # from the selected GitHub refs before reading requirements-test.txt.
          python -m pip install \
            "dag-ml @ git+https://github.com/GBeurier/dag-ml.git@${N4A_DAG_ML_REF}#subdirectory=crates/dag-ml-py" \
            "dag-ml-data @ git+https://github.com/GBeurier/dag-ml-data.git@${N4A_DAG_ML_DATA_REF}#subdirectory=crates/dag-ml-data-py"
          python -m pip install numpy -r requirements-test.txt
          python -m pip install -e . --no-deps
          python -m pip install mypy types-PyYAML

      - name: Run mypy
        run: mypy nirs4all

  tests:
    needs: [lint, type-check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # RC branch: dag-ml wheels are selected by the release lock but are not
          # published to PyPI yet, so satisfy nirs4all's hard runtime dependency
          # from the selected GitHub refs before reading requirements-test.txt.
          python -m pip install \
            "dag-ml @ git+https://github.com/GBeurier/dag-ml.git@${N4A_DAG_ML_REF}#subdirectory=crates/dag-ml-py" \
            "dag-ml-data @ git+https://github.com/GBeurier/dag-ml-data.git@${N4A_DAG_ML_DATA_REF}#subdirectory=crates/dag-ml-data-py"
          if [ "$RUNNER_OS" == "macOS" ]; then
            # Skip all DL backends on macOS (platform compatibility check only)
            grep -v -E '^(jax|jaxlib|flax|tensorflow|torch|tabpfn|keras)' requirements-test.txt > requirements-test-filtered.txt
            python -m pip install numpy -r requirements-test-filtered.txt
          elif [ "$RUNNER_OS" == "Windows" ]; then
            # Skip JAX ecosystem on Windows (uvloop is Unix-only)
            grep -v -E '^(jax|jaxlib|flax)' requirements-test.txt > requirements-test-filtered.txt
            python -m pip install numpy -r requirements-test-filtered.txt
          else
            # PyPI's Linux wheel now pulls CUDA/Triton dependencies even on the
            # CPU runner. The official CPU wheel avoids that unstable runtime.
            grep -v '^torch' requirements-test.txt > requirements-test-filtered.txt
            python -m pip install numpy -r requirements-test-filtered.txt
            python -m pip install --index-url https://download.pytorch.org/whl/cpu \
              'torch==2.13.0+cpu'
          fi

      - name: Install package (editable, no-deps — deps already from requirements-test.txt)
        run: python -m pip install -e . --no-deps

      - name: Run unit tests
        shell: bash
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
        run: |
          MARK=()
          if [ "$RUNNER_OS" == "macOS" ]; then
            MARK=(-m "not tensorflow and not torch and not keras and not jax and not stress")
          fi

          if [ "$RUNNER_OS" == "macOS" ]; then
            # macOS: run serially to avoid fork() deadlocks.
            python -m pytest -v --timeout=120 "${MARK[@]}" tests/unit/
          elif [ "$RUNNER_OS" == "Windows" ]; then
            # Keep native-framework tests out of xdist, then use a bounded
            # loadfile schedule.  ``worksteal -n auto`` deadlocks Windows
            # workers, while a fully serial suite exceeds the job budget.
            python -m pytest -v --timeout=300 \
              -m torch \
              tests/unit/operators/models/test_pytorch.py \
              tests/unit/pipeline/dagml/test_raw_training_lowerer.py
            python -m pytest -v --timeout=300 \
              -m tensorflow \
              tests/unit/operators/models/test_tensorflow.py \
              tests/unit/pipeline/dagml/test_raw_training_lowerer.py
            python -m pytest -v --timeout=300 \
              -m jax tests/unit/operators/models/test_jax.py
            python -m pytest -v -n 2 --dist loadfile --timeout=300 \
              -m "not torch and not tensorflow and not keras and not jax" tests/unit/
          else
            # TensorFlow and PyTorch both claim process-global native state. Run
            # each framework's explicit test files in a fresh interpreter; marker
            # selection over tests/unit would still import every test module.
            python -m pytest -v --timeout=300 \
              -m torch \
              tests/unit/operators/models/test_pytorch.py \
              tests/unit/pipeline/dagml/test_raw_training_lowerer.py
            python -m pytest -v --timeout=300 \
              -m tensorflow \
              tests/unit/operators/models/test_tensorflow.py \
              tests/unit/pipeline/dagml/test_raw_training_lowerer.py
            python -m pytest -v --timeout=300 \
              -m jax tests/unit/operators/models/test_jax.py
            python -m pytest -v -n auto --dist worksteal --timeout=300 \
              -m "not torch and not tensorflow and not keras and not jax" tests/unit/
          fi

      - name: Run quick integration pytest
        shell: bash
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
        run: |
          MARK=()
          if [ "$RUNNER_OS" == "macOS" ]; then
            MARK=(-m "not tensorflow and not torch and not keras and not jax and not stress")
          fi

          if [ "$RUNNER_OS" == "macOS" ]; then
            # macOS: run serially to avoid fork() deadlocks.
            python -m pytest -v --timeout=120 "${MARK[@]}" tests/integration/pipeline/
          elif [ "$RUNNER_OS" == "Windows" ]; then
            # The merge fixtures and TensorFlow replay own process-global or
            # write-contended state.  Exercise them serially, then bound the
            # portable remainder to two loadfile workers.
            python -m pytest -v --timeout=300 \
              tests/integration/pipeline/test_merge_mixed.py \
              tests/integration/pipeline/test_merge_per_branch.py
            python -m pytest -v --timeout=300 \
              -m tensorflow \
              tests/integration/pipeline/test_classification_integration.py \
              tests/integration/pipeline/test_finetune_integration.py \
              tests/integration/pipeline/test_prediction_reuse_integration.py
            python -m pytest -v -n 2 --dist loadfile --timeout=300 tests/integration/pipeline/ \
              -m "not torch and not tensorflow and not keras and not jax" \
              --ignore=tests/integration/pipeline/test_merge_mixed.py \
              --ignore=tests/integration/pipeline/test_merge_per_branch.py
          else
            # Serial subset with known write-contention under heavy xdist load
            python -m pytest -v --timeout=300 \
              tests/integration/pipeline/test_merge_mixed.py \
              tests/integration/pipeline/test_merge_per_branch.py

            # Keep TensorFlow persistence/replay tests in their own interpreter.
            python -m pytest -v --timeout=300 \
              -m tensorflow \
              tests/integration/pipeline/test_classification_integration.py \
              tests/integration/pipeline/test_finetune_integration.py \
              tests/integration/pipeline/test_prediction_reuse_integration.py

            # Parallel remainder
            python -m pytest -v -n auto --dist worksteal --timeout=300 tests/integration/pipeline/ \
              -m "not torch and not tensorflow and not keras and not jax" \
              --ignore=tests/integration/pipeline/test_merge_mixed.py \
              --ignore=tests/integration/pipeline/test_merge_per_branch.py
          fi
