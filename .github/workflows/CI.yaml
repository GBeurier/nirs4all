# Full scientific suites and examples run locally before publication.
name: CI
'on':
  push:
    branches:
    - main
    - master
    - rc/**
  pull_request:
    branches:
    - main
    - master
    - rc/**
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install ruff
      run: pip install ruff
    - name: Run ruff
      run: ruff check .
  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy -r requirements-test.txt
        python -m pip install -e .
        python -m pip install mypy types-PyYAML
    - name: Run mypy
      run: mypy nirs4all
  package-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade build twine
        python -m build --sdist --wheel --outdir dist
        python -m twine check dist/*
    - name: Install built wheel
      run: python -m pip install dist/*.whl
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
    - uses: actions/upload-artifact@v7
      with:
        name: sdk-dist-smoke
        path: dist/
        if-no-files-found: error
