# Lint, types, package smoke and the fast pytest cohort on every push and pull
# request. The slow integration suites run in tests-full.yml; release
# qualification and examples still run locally before publication.
name: CI
'on':
  push:
    branches:
    - main
    - master
    - rc/**
  pull_request:
    branches:
    - main
    - master
    - rc/**
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install ruff
      run: pip install ruff
    - name: Run ruff
      run: ruff check .
  type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy -r requirements-test.txt
        python -m pip install -e .
        python -m pip install mypy types-PyYAML
    - name: Run mypy
      run: mypy nirs4all
  tests:
    # Everything under tests/ except the slow integration suites named below,
    # which tests-full.yml runs nightly, on demand and when it changes.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      TF_FORCE_GPU_ALLOW_GROWTH: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@v6
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install the declared CPU test cohort and the SDK
      uses: ./.github/actions/test-environment
    - name: Run the unit, regression and fast integration suites
      run: >-
        python -m pytest -q -n auto --dist worksteal -m "not gpu" --timeout=1800 --durations=25
        tests/
        --ignore=tests/integration/parity
        --ignore=tests/integration/api
        --ignore=tests/integration/pipeline
        --ignore=tests/e2e
  package-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade build twine
        python -m build --sdist --wheel --outdir dist
        python -m twine check dist/*
    - name: Install built wheel
      run: python -m pip install dist/*.whl nirs4all-methods==1.3.18
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
    - uses: actions/upload-artifact@v7
      with:
        name: sdk-dist-smoke
        path: dist/
        if-no-files-found: error
