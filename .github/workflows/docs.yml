# .github/workflows/docs.yml
# Documentation CI workflow
# Builds docs with Sphinx and checks for broken links

name: Documentation

on:
  push:
    branches: [main, master, 'rc/**']
    paths:
      - 'docs/**'
      - 'nirs4all/**'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  pull_request:
    branches: [main, master, 'rc/**']
    paths:
      - 'docs/**'
      - 'nirs4all/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  N4A_DAG_ML_REF: 233d4ecdae14d2a810f9b01b4ce7c15bdedc9d27
  N4A_DAG_ML_DATA_REF: ffe533704a1a0b0c7bb7d97a997caade3f4ba36e

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt

      - name: Install nirs4all package
        run: |
          python -m pip install \
            "dag-ml @ git+https://github.com/GBeurier/dag-ml.git@${N4A_DAG_ML_REF}#subdirectory=crates/dag-ml-py" \
            "dag-ml-data @ git+https://github.com/GBeurier/dag-ml-data.git@${N4A_DAG_ML_DATA_REF}#subdirectory=crates/dag-ml-data-py"
          python -m pip install -e .

      - name: Build documentation
        run: |
          cd docs
          sphinx-build -b html source _build/html -W --keep-going 2>&1 | tee build.log

      - name: Check for build warnings
        run: |
          if grep -q "WARNING" docs/build.log; then
            echo "::warning::Documentation build produced warnings"
            grep "WARNING" docs/build.log || true
          fi

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html/
          retention-days: 7

  linkcheck:
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt
          python -m pip install \
            "dag-ml @ git+https://github.com/GBeurier/dag-ml.git@${N4A_DAG_ML_REF}#subdirectory=crates/dag-ml-py" \
            "dag-ml-data @ git+https://github.com/GBeurier/dag-ml-data.git@${N4A_DAG_ML_DATA_REF}#subdirectory=crates/dag-ml-data-py"
          python -m pip install -e .

      - name: Check external links
        run: |
          cd docs
          sphinx-build -b linkcheck source _build/linkcheck -W --keep-going 2>&1 | tee linkcheck.log

      - name: Report broken links
        run: |
          if [ -f docs/_build/linkcheck/output.txt ]; then
            echo "=== Link Check Results ==="
            cat docs/_build/linkcheck/output.txt

            # Count broken links
            broken=$(grep -c "\[broken\]" docs/_build/linkcheck/output.txt || echo "0")
            if [ "$broken" -gt "0" ]; then
              echo "::warning::Found $broken broken link(s)"
            fi
          fi

      - name: Upload linkcheck report
        uses: actions/upload-artifact@v7
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck/
          retention-days: 7
