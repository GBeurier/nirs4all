# .github/workflows/docs.yml
# Documentation CI workflow
# Builds docs with Sphinx and checks for broken links

name: Documentation

on:
  push:
    branches: [main, master, 'rc/**']
    paths:
      - 'docs/**'
      - 'nirs4all/**'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  pull_request:
    branches: [main, master, 'rc/**']
    paths:
      - 'docs/**'
      - 'nirs4all/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt

      - name: Install nirs4all package
        run: |
          python -m pip install --only-binary=:all: "dag-ml==0.3.41" "dag-ml-data==0.2.13"
          python -m pip install -e .

      - name: Build documentation
        run: |
          set -o pipefail
          cd docs
          sphinx-build -b html source _build/html -W --keep-going 2>&1 | tee build.log

      - name: Check for build warnings
        run: |
          if grep -q "WARNING" docs/build.log; then
            echo "::warning::Documentation build produced warnings"
            grep "WARNING" docs/build.log || true
          fi

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html/
          retention-days: 7

      - name: Upload GitHub Pages documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html/

  linkcheck:
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt
          python -m pip install --only-binary=:all: "dag-ml==0.3.41" "dag-ml-data==0.2.13"
          python -m pip install -e .

      - name: Check external links
        run: |
          set -o pipefail
          cd docs
          sphinx-build -b linkcheck source _build/linkcheck -W --keep-going 2>&1 | tee linkcheck.log

      - name: Report broken links
        run: |
          if [ -f docs/_build/linkcheck/output.txt ]; then
            echo "=== Link Check Results ==="
            cat docs/_build/linkcheck/output.txt

            # Count broken links
            broken=$(grep -c "\[broken\]" docs/_build/linkcheck/output.txt || echo "0")
            if [ "$broken" -gt "0" ]; then
              echo "::warning::Found $broken broken link(s)"
            fi
          fi

      - name: Upload linkcheck report
        uses: actions/upload-artifact@v7
        with:
          name: linkcheck-report
          path: docs/_build/linkcheck/
          retention-days: 7

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build-docs, linkcheck]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: documentation-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
