# Full scientific suites and examples run locally before publication.
name: Example source validation
'on':
  workflow_dispatch: null
jobs:
  example-source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Validate example Python syntax
      run: python -m compileall -q examples/user examples/developer examples/reference
