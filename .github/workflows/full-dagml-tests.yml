# Full scientific suites and examples run locally before publication.
name: SDK package build
'on':
  workflow_dispatch: null
jobs:
  exhaustive:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/shared-test-and-docs.yml
    with:
      skip-tests: false
      upload-coverage: false
      docs-artifact-name: full-dagml-documentation-html
