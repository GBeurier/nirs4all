name: Full DAG-ML pytest

# Release protocol: run the exhaustive suite locally before tagging; the PR
# and publication gates use fast unit/API/parity smoke tests. After PyPI
# publication, dispatch this complete Action for independent confirmation.
# The reusable test job has no extra timeout beyond GitHub's hosted-runner cap.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  exhaustive:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/shared-test-and-docs.yml
    with:
      skip-tests: false
      upload-coverage: false
      docs-artifact-name: full-dagml-documentation-html
