name: Installed multimodal candidate

# A manual distribution gate: it builds the current nirs4all wheel and pinned
# IO/DAG-ML candidates, then runs the provider workflow outside source checkouts.
# It never publishes packages.
on:
  workflow_dispatch:
    inputs:
      io_ref:
        description: "nirs4all-io commit to qualify"
        required: true
        default: "e84eb3eda73629dddc1b7f8335f8481d142ea9ac"
      dag_ref:
        description: "DAG-ML commit to qualify"
        required: true
        default: "27951318d503138db611894d291d6653a63ce957"

permissions:
  contents: read

jobs:
  installed-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GBeurier/nirs4all-io
          ref: ${{ inputs.io_ref }}
          path: candidate-io
      - uses: actions/checkout@v7
        with:
          repository: GBeurier/dag-ml
          ref: ${{ inputs.dag_ref }}
          path: candidate-dag
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build candidate wheels without publishing
        shell: bash
        run: |
          python -m pip install build maturin
          python -m build --wheel --outdir dist
          cd candidate-io
          python -m maturin build --locked --release -m bindings/python/Cargo.toml --interpreter python --out ../dist
          cd ../candidate-dag
          python -m maturin build --locked --release -m crates/dag-ml-py/Cargo.toml --interpreter python --out ../dist
      - name: Install candidate wheels with current native dependencies
        shell: bash
        run: |
          python -m pip install "dag-ml-data==0.2.12" \
            "nirs4all-core==0.4.0" "nirs4all-methods==1.2.1" "pls4all==1.2.1" \
            dist/dag_ml*.whl dist/nirs4all_io*.whl dist/nirs4all-*.whl
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          assert version("nirs4all") == "1.3.1.dev0"
          assert version("nirs4all-io") == "0.2.1.dev0"
          assert version("dag-ml") == "0.3.30"
          PY
      - name: Qualify installed CV, generated HPO, resume, archive and prediction
        shell: bash
        env:
          N4A_DAGML_INPROCESS: "0"
          ENABLE_HPO_SUBPROCESS: "1"
          N4A_SMOKE_ROOT: ${{ runner.temp }}/installed-provider
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/qualification/installed_multimodal_provider.py"
      - name: Qualify installed four-modality demo and fresh-process replay
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/qualification/installed_multimodal_demo.py"
      - name: Qualify all native optimizer combinations on installed generated views
        shell: bash
        env:
          N4A_DAGML_INPROCESS: "1"
          N4A_FULL_HPO_MATRIX: "1"
          N4A_SMOKE_ROOT: ${{ runner.temp }}/installed-provider-matrix
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/qualification/installed_multimodal_provider.py"
      - name: Qualify all native optimizer combinations in the isolated worker
        shell: bash
        env:
          N4A_DAGML_INPROCESS: "0"
          ENABLE_HPO_SUBPROCESS: "1"
          N4A_FULL_HPO_MATRIX: "1"
          N4A_SMOKE_ROOT: ${{ runner.temp }}/installed-provider-worker-matrix
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/qualification/installed_multimodal_provider.py"
