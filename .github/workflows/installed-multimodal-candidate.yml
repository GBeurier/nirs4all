# Provider CV/HPO/resume/archive/replay suites run locally; build candidate packages only.
name: Installed multimodal package build
'on':
  workflow_dispatch:
    inputs:
      io_ref:
        description: nirs4all-io commit to qualify
        required: true
        default: v0.2.6
      dag_ref:
        description: DAG-ML commit to qualify
        required: true
        default: v0.3.41
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installed-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        repository: GBeurier/nirs4all-io
        ref: ${{ inputs.io_ref || 'v0.2.6' }}
        path: candidate-io
    - uses: actions/checkout@v7
      with:
        repository: GBeurier/dag-ml
        ref: ${{ inputs.dag_ref || 'v0.3.41' }}
        path: candidate-dag
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: dtolnay/rust-toolchain@stable
    - name: Build candidate wheels without publishing
      shell: bash
      run: |
        python -m pip install build maturin
        python -m build --wheel --outdir dist
        cd candidate-io
        python -m maturin build --locked --release -m bindings/python/Cargo.toml --interpreter python --out ../dist
        cd ../candidate-dag
        python scripts/validate_release_metadata.py
        python -m maturin build --locked --release -m crates/dag-ml-py/Cargo.toml --interpreter python --out ../dist
    - name: Install candidate wheels with current native dependencies
      shell: bash
      run: |
        python -m pip install "dag-ml-data==0.2.13" \
          "nirs4all-core==0.4.5" "nirs4all-methods==1.3.4" "pls4all==1.3.4" \
          dist/dag_ml*.whl dist/nirs4all_io*.whl dist/nirs4all-*.whl
    - name: Verify installed package imports and versions
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
    - uses: actions/upload-artifact@v7
      with:
        name: installed-macos-candidate-wheels
        path: dist/
        if-no-files-found: error
