name: Methods Installed Parity

on:
  pull_request:
    paths:
      - "nirs4all/operators/methods/**"
      - "nirs4all/api/native_*.py"
      - "nirs4all/api/run.py"
      - "nirs4all/pipeline/dagml/**"
      - "tests/unit/operators/methods/**"
      - "tests/unit/api/test_native_witness.py"
      - "tests/unit/pipeline/dagml/test_terminal_predict_lowerer.py"
      - "tests/integration/api/test_native_methods_witness.py"
      - "pyproject.toml"
      - ".github/workflows/methods-installed.yml"
  workflow_dispatch:
    inputs:
      methods_package:
        description: "Package spec to install for nirs4all-methods"
        required: false
        default: "nirs4all-methods>=1.0.18,<2"

jobs:
  n4m-binding:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install nirs4all test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Install qualified DAG-ML and nirs4all-methods bindings
        env:
          METHODS_PACKAGE: ${{ inputs.methods_package || 'nirs4all-methods>=1.0.18,<2' }}
        run: python -m pip install "dag-ml==0.3.25" "$METHODS_PACKAGE"

      - name: Verify n4m binding loads
        run: |
          python - <<'PY'
          import dag_ml
          import n4m
          from importlib.metadata import version
          from packaging.version import Version

          assert version("dag-ml") == "0.3.25"
          assert dag_ml.version() == "0.3.25"
          print("n4m abi:", n4m.abi_version())
          print("n4m lib:", n4m.library_path())
          installed = Version(version("nirs4all-methods"))
          assert installed >= Version("1.0.13"), installed
          PY

      - name: Run methods parity gate
        env:
          NIRS4ALL_REQUIRE_N4M: "1"
        run: |
          env -u N4M_LIB_PATH python -m pytest -m methods tests/unit/operators/methods/test_n4m_ops.py -q
          env -u N4M_LIB_PATH python -m pytest tests/unit/pipeline/dagml/test_terminal_predict_lowerer.py -q
          env -u N4M_LIB_PATH python -m pytest -m methods tests/integration/api/test_native_methods_witness.py -q
