# Full Methods parity runs locally before publication.
name: Methods installed package ABI
'on':
  pull_request:
    paths:
    - nirs4all/operators/methods/**
    - nirs4all/api/native_*.py
    - nirs4all/api/run.py
    - nirs4all/pipeline/dagml/**
    - tests/unit/operators/methods/**
    - tests/unit/api/test_native_witness.py
    - tests/unit/pipeline/dagml/test_terminal_predict_lowerer.py
    - tests/integration/api/test_native_methods_witness.py
    - pyproject.toml
    - .github/workflows/methods-installed.yml
  workflow_dispatch:
    inputs:
      methods_package:
        description: Package spec to install for nirs4all-methods
        required: false
        default: nirs4all-methods==1.3.4
jobs:
  n4m-binding:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Build and install SDK with published native dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        python -m build --wheel --outdir dist
        python -m pip install dist/*.whl
    - name: Install qualified DAG-ML and nirs4all-methods bindings
      env:
        METHODS_PACKAGE: ${{ inputs.methods_package || 'nirs4all-methods==1.3.4' }}
      run: python -m pip install "dag-ml==0.3.41" "$METHODS_PACKAGE"
    - name: Verify installed bindings and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
