# Scientific lifecycle suites run locally; this checks built installed packages.
name: Native package ABI
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  native-lifecycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.13'
    env: {}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install built SDK package
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --outdir dist
        python -m pip install dist/*.whl
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
