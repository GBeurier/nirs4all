# Full scientific suites and examples run locally before publication.
name: Pre-Publish Check
'on':
  workflow_dispatch: null
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install ruff
      run: python -m pip install --upgrade ruff
    - name: Run ruff check
      run: ruff check .
  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install numpy -r requirements-test.txt
        python -m pip install -e . --no-deps
        python -m pip install mypy types-PyYAML
    - name: Run mypy
      run: mypy nirs4all
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r docs/readthedocs.requirements.txt
    - name: Install nirs4all package
      run: python -m pip install -e .
    - name: Build documentation (strict mode)
      run: |
        cd docs
        sphinx-build -b html source _build/html -W --keep-going
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v7
      with:
        name: pre-publish-docs
        path: docs/_build/html/
        retention-days: 3
  test-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade build twine
        python -m build --sdist --wheel --outdir dist
        python -m twine check dist/*
    - name: Install built wheel
      run: python -m pip install dist/*.whl
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
    - uses: actions/upload-artifact@v7
      with:
        name: sdk-dist-smoke
        path: dist/
        if-no-files-found: error
  local-qualification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Verify local qualification for reviewed publication candidate
      run: python scripts/verify_local_qualification.py --project sdk --receipt compat/local-qualification.json --root .
