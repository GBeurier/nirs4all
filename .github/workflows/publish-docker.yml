# An image failure never blocks or republishes the library package.
name: Publish Docker image independently
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SDK tag whose qualified wheel is already on PyPI
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      tag_sha: ${{ steps.target.outputs.tag_sha }}
      docker_version: ${{ steps.target.outputs.docker_version }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Resolve immutable image source
      id: target
      env:
        INPUT_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
          echo '::error::Image delivery must run from main.'
          exit 1
        fi
        if [[ ! "$INPUT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
          echo '::error::An existing immutable SemVer SDK tag is required.'
          exit 1
        fi
        git fetch --no-tags origin "refs/tags/$INPUT_TAG:refs/tags/$INPUT_TAG"
        tag_sha=$(git rev-parse "$INPUT_TAG^{commit}")
        git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA"
        prerelease=false
        if [[ "$INPUT_TAG" == *-rc.* ]]; then prerelease=true; fi
        printf 'release_tag=%s\ntag_sha=%s\ndocker_version=%s\nprerelease=%s\n' "$INPUT_TAG" "$tag_sha" "$INPUT_TAG" "$prerelease" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Verify the library is already published with its qualified hash
      env:
        TAG_SHA: ${{ steps.target.outputs.tag_sha }}
        RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
      run: |
        python - <<'PY'
        import json
        import os
        import subprocess
        import urllib.request

        source = os.environ["TAG_SHA"]
        qualified = json.loads(subprocess.check_output(["git", "show", f"{source}:qualification/release-artifacts.json"], text=True))
        version = os.environ["RELEASE_TAG"].replace("-rc.", "rc")
        assert qualified["version"] == version
        with urllib.request.urlopen(f"https://pypi.org/pypi/nirs4all/{version}/json", timeout=60) as response:
            published = json.load(response)
        expected = qualified["wheel"]
        matches = [item for item in published["urls"] if item["filename"] == expected["filename"]]
        assert len(matches) == 1 and matches[0]["digests"]["sha256"] == expected["sha256"] and matches[0]["size"] == expected["bytes"], "Public SDK wheel differs from the immutable qualified source"
        print("Verified existing public PyPI package; image delivery is independent:", version)
        PY
  publish-docker:
    needs:
    - release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.release-preflight.outputs.tag_sha }}
    - name: Verify Docker source tag
      shell: bash
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: |
        set -euo pipefail
        if [[ -n "$EXPECTED_TAG_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_TAG_SHA" ]]; then
          echo '::error::Release tag changed after preflight.'
          exit 1
        fi
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract version tag
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: latest=false
        tags: |
          type=raw,value=${{ needs.release-preflight.outputs.docker_version }}
          type=raw,value=latest,enable=${{ needs.release-preflight.outputs.prerelease == 'false' }}
    - uses: docker/build-push-action@v7
      id: docker
      with:
        context: .
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
    - name: Verify built image before publication
      shell: bash
      env:
        DOCKER_VERSION: ${{ needs.release-preflight.outputs.docker_version }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}:$DOCKER_VERSION"
        sdk_version="${DOCKER_VERSION//-rc./rc}"
        docker run --pull never --rm -i -e EXPECTED_SDK_VERSION="$sdk_version" "$image" -I -B - <<'PY'
        import importlib.metadata as metadata
        import json
        import os
        import n4m
        from pls4all import Context

        expected = {
            "nirs4all": os.environ["EXPECTED_SDK_VERSION"],
            "dag-ml": "0.5.0", "dag-ml-data": "0.2.17",
            "nirs4all-core": "0.6.1", "nirs4all-io": "0.3.8",
            "nirs4all-formats": "0.2.19",
            "nirs4all-methods": "1.5.1", "pls4all": "1.5.1",
        }
        actual = {name: metadata.version(name) for name in expected}
        assert actual == expected, actual
        assert n4m.abi_version() == (2, 24, 0)
        assert n4m.version().split("+abi.")[0] == actual["nirs4all-methods"]
        with Context():
            pass
        print(json.dumps({"schema": "nirs4all.image-native-cohort.v1",
                          "distributions": actual, "methods_abi": n4m.abi_version(),
                          "native_context_opened": True}, sort_keys=True))
        PY
        docker run --pull never --rm "$image" -I -B -m pip check
    - name: Publish the independently qualified image
      env:
        IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        set -euo pipefail
        while IFS= read -r image_tag; do
          test -n "$image_tag"
          docker push "$image_tag"
        done <<< "$IMAGE_TAGS"
