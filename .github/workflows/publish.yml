# Full scientific suites and examples run locally before publication.
name: Build & Publish
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to republish after a failed gate
        required: false
        type: string
      qualification_ref:
        description: Exact commit containing fresh retained qualification for the immutable product source
        required: false
        type: string
      publish_release:
        description: Publish the existing tag after all gates pass (main only)
        required: false
        default: false
        type: boolean
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      tag_sha: ${{ steps.target.outputs.tag_sha }}
      docker_version: ${{ steps.target.outputs.docker_version }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Verify manual publication target
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        INPUT_TAG: ${{ inputs.release_tag }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
      run: "set -euo pipefail\nif [[ \"$EVENT_NAME\" == 'release' ]]; then\n  git fetch --no-tags origin \"refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG\"\
        \n  tag_sha=$(git rev-parse \"$RELEASE_TAG^{commit}\")\n  if [[ \"$GITHUB_SHA\" != \"$tag_sha\" ]]; then\n    echo\
        \ '::error::Release event commit does not match its tag.'\n    exit 1\n  fi\n  echo \"release_tag=$RELEASE_TAG\" >>\
        \ \"$GITHUB_OUTPUT\"\n  echo \"tag_sha=$tag_sha\" >> \"$GITHUB_OUTPUT\"\n  echo \"docker_version=${RELEASE_TAG#v}\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"prerelease=$RELEASE_PRERELEASE\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nif [[ \"$PUBLISH_RELEASE\"\
        \ != 'true' ]]; then\n  echo 'Manual dry-run: publication disabled.'\n  exit 0\nfi\nif [[ \"$GITHUB_REF\" != 'refs/heads/main'\
        \ ]]; then\n  echo '::error::Manual publication must run from main.'\n  exit 1\nfi\nif [[ ! \"$INPUT_TAG\" =~ ^[0-9]+\\\
        .[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$ ]]; then\n  echo '::error::release_tag must be an existing SemVer release tag.'\n\
        \  exit 1\nfi\nrelease_json=$(gh api \"repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG\")\nif ! jq -e --arg tag\
        \ \"$INPUT_TAG\" \\\n  '.tag_name == $tag and .draft == false and .published_at != null' \\\n  <<< \"$release_json\"\
        \ >/dev/null; then\n  echo '::error::The matching GitHub Release must already be published.'\n  exit 1\nfi\npackage_version=\"\
        ${INPUT_TAG//-rc./rc}\"\npypi_status=$(curl --retry 2 --retry-delay 2 -sS -o /dev/null \\\n  -w '%{http_code}' \"\
        https://pypi.org/pypi/nirs4all/$package_version/json\")\nif [[ \"$pypi_status\" != '404' ]]; then\n  echo \"::error::PyPI\
        \ returned HTTP $pypi_status for nirs4all==$package_version; publication requires absence.\"\n  exit 1\nfi\ngit fetch\
        \ --no-tags origin \"refs/tags/$INPUT_TAG:refs/tags/$INPUT_TAG\"\ntag_sha=$(git rev-parse \"$INPUT_TAG^{commit}\"\
        )\nprerelease=$(jq -r '.prerelease' <<< \"$release_json\")\necho \"release_tag=$INPUT_TAG\" >> \"$GITHUB_OUTPUT\"\n\
        echo \"tag_sha=$tag_sha\" >> \"$GITHUB_OUTPUT\"\necho \"docker_version=$INPUT_TAG\" >> \"$GITHUB_OUTPUT\"\necho \"\
        prerelease=$prerelease\" >> \"$GITHUB_OUTPUT\"\necho \"Verified published Release $INPUT_TAG at $tag_sha; PyPI version\
        \ is absent.\"\n"
  build-docs:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.release-preflight.outputs.release_tag)
          || github.ref }}
    - name: Verify documented commit matches preflight
      if: github.event_name == 'release' || inputs.publish_release
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install documentation dependencies
      run: 'python -m pip install --upgrade pip setuptools wheel

        python -m pip install -r docs/readthedocs.requirements.txt

        '
    - name: Install nirs4all package
      run: python -m pip install -e .
    - name: Build documentation
      run: 'cd docs

        sphinx-build -b html source _build/html --keep-going

        '
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v7
      with:
        name: documentation-html
        path: docs/_build/html/
        retention-days: 7
  build:
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.release-preflight.outputs.release_tag)
          || github.ref }}
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Verify version consistency
      if: github.event_name == 'release' || inputs.publish_release
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: "set -euo pipefail\n# Version is single-sourced from nirs4all/__init__.py (pyproject declares it\n# dynamically\
        \ via attr:), so read __version__ directly rather than pyproject.\nPKG_VERSION=$(grep -E '^__version__' nirs4all/__init__.py\
        \ | cut -d'\"' -f2)\nTAG_VERSION=\"$RELEASE_TAG\"\nTAG_VERSION=\"${TAG_VERSION#v}\"\n# Product RC tags use SemVer\
        \ spelling (1.0.0-rc.1), while Python\n# package metadata uses the equivalent PEP 440 spelling (1.0.0rc1).\nTAG_VERSION=\"\
        ${TAG_VERSION//-rc./rc}\"\nif [[ \"$PKG_VERSION\" != \"$TAG_VERSION\" ]]; then\n  echo \"::error::Version mismatch:\
        \ nirs4all.__version__=$PKG_VERSION tag=$TAG_VERSION\"\n  exit 1\nfi\nif [[ -n \"$EXPECTED_TAG_SHA\" && \"$(git rev-parse\
        \ HEAD)\" != \"$EXPECTED_TAG_SHA\" ]]; then\n  echo '::error::Release tag changed after preflight.'\n  exit 1\nfi\n\
        echo \"Version verified: $PKG_VERSION\"\n"
    - name: Build the qualified distributions
      shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        qualified = json.loads(Path("qualification/release-artifacts.json").read_text())
        source = qualified["source_sha"]
        subprocess.run(["git", "merge-base", "--is-ancestor", source, "HEAD"], check=True)
        epoch = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", source], text=True))
        if epoch != qualified["source_date_epoch"]:
            raise SystemExit("Qualified source timestamp differs from its immutable commit")
        subprocess.run([sys.executable, "-m", "pip", "install", *qualified["build_requirements"]], check=True)
        environment = {**os.environ, "SOURCE_DATE_EPOCH": str(epoch), "PYTHONHASHSEED": "0"}
        subprocess.run([sys.executable, "-m", "build", "--no-isolation", "--sdist", "--wheel", "--outdir", "dist"], env=environment, check=True)
        expected = qualified["wheel"]
        wheel = Path("dist") / expected["filename"]
        if wheel.stat().st_size != expected["bytes"] or hashlib.sha256(wheel.read_bytes()).hexdigest() != expected["sha256"]:
            raise SystemExit("Built SDK wheel differs from the artifact qualified on Linux and Windows")
        print("Qualified SDK wheel reproduced exactly:", expected["sha256"])
        PY
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist
  publish-pypi:
    needs:
    - build
    - build-docs
    - package-smoke
    - local-qualification
    if: github.event_name == 'release' || inputs.publish_release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
  post-publish-smoke:
    needs:
    - release-preflight
    - publish-pypi
    if: github.event_name == 'release' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.release-preflight.outputs.release_tag }}
    - name: Verify exact post-publication source
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install the exact PyPI release
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
      run: "set -euo pipefail\npackage_version=\"${RELEASE_TAG#v}\"\npackage_version=\"${package_version//-rc./rc}\"\npython\
        \ -m pip install --upgrade pip\nfor attempt in 1 2 3 4 5 6; do\n  if python -m pip install --no-cache-dir \\\n   \
        \ --index-url https://pypi.org/simple/ \"nirs4all==${package_version}\"; then\n    break\n  fi\n  if [ \"${attempt}\"\
        \ -eq 6 ]; then\n    echo \"::error::PyPI did not serve nirs4all==${package_version} after 6 attempts\"\n    exit\
        \ 1\n  fi\n  sleep 10\ndone\n"
    - name: Verify public installed package metadata, origins and native ABI
      shell: bash
      run: 'set -euo pipefail

        python -m pip install nirs4all-methods==1.3.9

        source_root="$PWD"

        cd "$RUNNER_TEMP"

        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"

        python -m pip check

        '
  publish-docker:
    needs:
    - release-preflight
    - build
    - publish-pypi
    - local-qualification
    if: github.event_name == 'release' || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.release-preflight.outputs.release_tag }}
    - name: Verify Docker source tag
      shell: bash
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: "set -euo pipefail\nif [[ -n \"$EXPECTED_TAG_SHA\" && \"$(git rev-parse HEAD)\" != \"$EXPECTED_TAG_SHA\" ]]; then\n\
        \  echo '::error::Release tag changed after preflight.'\n  exit 1\nfi\n"
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract version tag
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: latest=false
        tags: 'type=raw,value=${{ needs.release-preflight.outputs.docker_version }}

          type=raw,value=latest,enable=${{ needs.release-preflight.outputs.prerelease == ''false'' }}

          '
    - uses: docker/build-push-action@v7
      id: docker
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Verify published image native cohort
      shell: bash
      env:
        IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
        DOCKER_VERSION: ${{ needs.release-preflight.outputs.docker_version }}
      run: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY,,}@$IMAGE_DIGEST"
        sdk_version="${DOCKER_VERSION//-rc./rc}"
        docker run --rm -i -e EXPECTED_SDK_VERSION="$sdk_version" "$image" -I -B - <<'PY'
        import importlib.metadata as metadata
        import json
        import os
        import n4m
        from pls4all import Context

        expected = {
            "nirs4all": os.environ["EXPECTED_SDK_VERSION"],
            "dag-ml": "0.3.43", "dag-ml-data": "0.2.13",
            "nirs4all-core": "0.4.6", "nirs4all-io": "0.2.11",
            "nirs4all-formats": "0.2.13",
            "nirs4all-methods": "1.3.9", "pls4all": "1.3.9",
        }
        actual = {name: metadata.version(name) for name in expected}
        assert actual == expected, actual
        assert n4m.abi_version() == (2, 20, 0)
        assert n4m.version().split("+abi.")[0] == actual["nirs4all-methods"]
        with Context():
            pass
        print(json.dumps({"schema": "nirs4all.image-native-cohort.v1",
                          "distributions": actual, "methods_abi": n4m.abi_version(),
                          "native_context_opened": True}, sort_keys=True))
        PY
        docker run --rm "$image" -I -B -m pip check
  notify-conda-forge:
    needs:
    - release-preflight
    - publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.publish_release
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch SHA256 and generate conda-forge update instructions
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
      run: "VERSION=\"$RELEASE_TAG\"\nVERSION=\"${VERSION#v}\"\n\n# Wait for PyPI to index the new version (up to 5 minutes)\n\
        SHA256=\"\"\nfor i in $(seq 1 10); do\n  SHA256=$(curl -sL \"https://pypi.org/pypi/nirs4all/$VERSION/json\" | \\\n\
        \    python3 -c \"import sys,json; d=json.load(sys.stdin); \\\n    print([u['digests']['sha256'] for u in d['urls']\
        \ if u['filename'].endswith('.tar.gz')][0])\" 2>/dev/null) && break\n  echo \"Waiting for PyPI to index version $VERSION\
        \ (attempt $i/10)...\"\n  sleep 30\ndone\n\necho \"## Conda-forge Update\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        \nif [[ -z \"$SHA256\" ]]; then\n  echo \"::warning::Could not fetch SHA256 from PyPI for version $VERSION\"\n  echo\
        \ \"Could not fetch SHA256 automatically. Update manually:\" >> $GITHUB_STEP_SUMMARY\n  echo \"\\`\\`\\`bash\" >>\
        \ $GITHUB_STEP_SUMMARY\n  echo \"python scripts/sync_conda_recipe.py --sha $VERSION\" >> $GITHUB_STEP_SUMMARY\n  echo\
        \ \"\\`\\`\\`\" >> $GITHUB_STEP_SUMMARY\nelse\n  echo \"The regro-cf-autotick-bot should automatically create a PR\
        \ to the feedstock.\" >> $GITHUB_STEP_SUMMARY\n  echo \"If it doesn't within 24h, manually update:\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"\" >> $GITHUB_STEP_SUMMARY\n  echo \"- **Version**: \\`$VERSION\\`\" >> $GITHUB_STEP_SUMMARY\n  echo \"\
        - **SHA256**: \\`$SHA256\\`\" >> $GITHUB_STEP_SUMMARY\n  echo \"\" >> $GITHUB_STEP_SUMMARY\n  echo \"Or run:\" >>\
        \ $GITHUB_STEP_SUMMARY\n  echo \"\\`\\`\\`bash\" >> $GITHUB_STEP_SUMMARY\n  echo \"python scripts/sync_conda_recipe.py\
        \ --sha $VERSION\" >> $GITHUB_STEP_SUMMARY\n  echo \"\\`\\`\\`\" >> $GITHUB_STEP_SUMMARY\n\n  # Also update meta.yaml\
        \ in the repo for reference\n  python scripts/sync_conda_recipe.py --sha \"$VERSION\" || true\nfi\n"
  package-smoke:
    needs:
    - release-preflight
    - build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.release-preflight.outputs.release_tag)
          || github.ref }}
    - name: Verify checked out commit matches publication target
      if: github.event_name == 'release' || inputs.publish_release
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Install built wheel
      run: python -m pip install dist/*.whl nirs4all-methods==1.3.9
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: 'source_root="$PWD"

        cd "$RUNNER_TEMP"

        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"

        python -m pip check

        '
  local-qualification:
    needs: release-preflight
    if: github.event_name == 'release' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.release-preflight.outputs.release_tag)
          || github.ref }}
    - name: Verify checked out commit matches publication target
      if: github.event_name == 'release' || inputs.publish_release
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Load fresh qualification evidence for the immutable source
      if: github.event_name == 'workflow_dispatch' && inputs.qualification_ref != ''
      shell: bash
      env:
        QUALIFICATION_REF: ${{ inputs.qualification_ref }}
      run: |
        set -euo pipefail
        [[ "$QUALIFICATION_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Exact qualification commit required'; exit 1; }
        git fetch --no-tags origin "$QUALIFICATION_REF"
        test "$(git rev-parse FETCH_HEAD)" = "$QUALIFICATION_REF"
        git checkout "$QUALIFICATION_REF" -- qualification compat/local-qualification.json
        # The verifier from the release tag checks these reports against the
        # actual immutable runtime sources, hashes, artifacts and mandatory gates.
    - name: Verify retained local tests and examples before publication
      run: python scripts/verify_local_qualification.py --project sdk --receipt compat/local-qualification.json --root .
