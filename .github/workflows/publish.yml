# .github/workflows/publish.yml
name: Build & Publish

on:
  release:
    types: [ published ]     # clicking "Publish Release" triggers real PyPI
  # Manual runs are deliberately dry-runs: tests, docs, and distributions only.
  workflow_dispatch:

jobs:
  # Run full test suite before publishing
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # PyPI's Linux wheel pulls CUDA/Triton dependencies even on a CPU
          # runner. Install the official CPU wheel so eager Torch tests do
          # not initialize the unsupported Triton runtime.
          grep -v '^torch' requirements-test.txt > requirements-test-linux.txt
          python -m pip install numpy -r requirements-test-linux.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.13.0+cpu'

      - name: Install package (editable, no-deps — deps already from requirements-test.txt)
        run: python -m pip install -e . --no-deps

      - name: Gate real library usability
        timeout-minutes: 5
        uses: ./.github/actions/library-usability

      - name: Run full pytest + coverage
        shell: bash
        run: |
          python -m coverage erase
          python -m pytest -v --timeout=300 -n 0 \
            tests/integration/pipeline/test_merge_mixed.py \
            tests/integration/pipeline/test_merge_per_branch.py \
            --cov=nirs4all --cov-append
          XLA_PYTHON_CLIENT_PREALLOCATE=false TF_FORCE_GPU_ALLOW_GROWTH=true \
            python -m pytest -v --timeout=300 -n 0 -m gpu tests/ \
            --ignore=tests/integration/parity/test_conformance_dual_engine.py \
            --cov=nirs4all --cov-append
          CUDA_VISIBLE_DEVICES='' XLA_PYTHON_CLIENT_PREALLOCATE=false TF_FORCE_GPU_ALLOW_GROWTH=true \
            python -m pytest -v --timeout=300 -n 2 --dist worksteal -m 'not gpu' tests/ \
            --ignore=tests/integration/pipeline/test_merge_mixed.py \
            --ignore=tests/integration/pipeline/test_merge_per_branch.py \
            --ignore=tests/integration/parity/test_conformance_dual_engine.py \
            --cov=nirs4all --cov-append --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Build and verify documentation
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt

      - name: Install nirs4all package
        run: python -m pip install -e .

      - name: Build documentation
        run: |
          cd docs
          sphinx-build -b html source _build/html --keep-going

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html/
          retention-days: 7

  # Release publication is blocked unless every dynamically discovered example
  # passes strict output checks (tracebacks, NaNs, and empty results).
  verify-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install example dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install jax jaxlib tensorflow
          python -m pip install -r requirements-examples.txt
          python -m pip install -e .

      - name: Run all strict examples once
        run: |
          cd examples
          chmod +x run_ci_examples.sh
          ./run_ci_examples.sh -c all -j 2 -k
        timeout-minutes: 45

  # Build distribution packages (after tests, docs, and examples pass)
  build:
    needs: [run-tests, build-docs, verify-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify version consistency
        if: github.event_name == 'release'
        shell: bash
        run: |
          # Version is single-sourced from nirs4all/__init__.py (pyproject declares it
          # dynamically via attr:), so read __version__ directly rather than pyproject.
          PKG_VERSION=$(grep -E '^__version__' nirs4all/__init__.py | cut -d'"' -f2)
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          # Product RC tags use SemVer spelling (1.0.0-rc.1), while Python
          # package metadata uses the equivalent PEP 440 spelling (1.0.0rc1).
          TAG_VERSION="${TAG_VERSION//-rc./rc}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch: nirs4all.__version__=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Build dists
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # Publish to PyPI (only after build succeeds, which requires tests + docs)
  publish-pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Build and push Docker image to GHCR after the release tag/version check.
  publish-docker:
    needs: [run-tests, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Notify about conda-forge feedstock update (after PyPI publish)
  notify-conda-forge:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch SHA256 and generate conda-forge update instructions
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          # Wait for PyPI to index the new version (up to 5 minutes)
          SHA256=""
          for i in $(seq 1 10); do
            SHA256=$(curl -sL "https://pypi.org/pypi/nirs4all/$VERSION/json" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); \
              print([u['digests']['sha256'] for u in d['urls'] if u['filename'].endswith('.tar.gz')][0])" 2>/dev/null) && break
            echo "Waiting for PyPI to index version $VERSION (attempt $i/10)..."
            sleep 30
          done

          echo "## Conda-forge Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -z "$SHA256" ]]; then
            echo "::warning::Could not fetch SHA256 from PyPI for version $VERSION"
            echo "Could not fetch SHA256 automatically. Update manually:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "python scripts/sync_conda_recipe.py --sha $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "The regro-cf-autotick-bot should automatically create a PR to the feedstock." >> $GITHUB_STEP_SUMMARY
            echo "If it doesn't within 24h, manually update:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "- **SHA256**: \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Or run:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "python scripts/sync_conda_recipe.py --sha $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            # Also update meta.yaml in the repo for reference
            python scripts/sync_conda_recipe.py --sha "$VERSION" || true
          fi
