# .github/workflows/publish.yml
name: Build & Publish

on:
  release:
    types: [ published ]     # clicking "Publish Release" triggers real PyPI
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable release tag to republish after a failed gate'
        required: false
        type: string
      publish_release:
        description: 'Publish the existing tag after all gates pass (main only)'
        required: false
        default: false
        type: boolean

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      tag_sha: ${{ steps.target.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release

      - name: Verify manual publication target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'release' ]]; then
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PUBLISH_RELEASE" != 'true' ]]; then
            echo 'Manual dry-run: publication disabled.'
            exit 0
          fi
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Manual publication must run from main.'
            exit 1
          fi
          if [[ ! "$INPUT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo '::error::release_tag must be an existing SemVer release tag.'
            exit 1
          fi
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG")
          if ! jq -e --arg tag "$INPUT_TAG" \
            '.tag_name == $tag and .draft == false and .published_at != null' \
            <<< "$release_json" >/dev/null; then
            echo '::error::The matching GitHub Release must already be published.'
            exit 1
          fi
          package_version="${INPUT_TAG//-rc./rc}"
          pypi_status=$(curl --retry 2 --retry-delay 2 -sS -o /dev/null \
            -w '%{http_code}' "https://pypi.org/pypi/nirs4all/$package_version/json")
          if [[ "$pypi_status" != '404' ]]; then
            echo "::error::PyPI returned HTTP $pypi_status for nirs4all==$package_version; publication requires absence."
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$INPUT_TAG:refs/tags/$INPUT_TAG"
          tag_sha=$(git rev-parse "$INPUT_TAG^{commit}")
          echo "release_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "Verified published Release $INPUT_TAG at $tag_sha; PyPI version is absent."

  # Run the fast source gate; exhaustive DAG-ML coverage runs weekly/on demand.
  run-tests:
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned dag-ml CLI source
        uses: actions/checkout@v6
        with:
          repository: GBeurier/dag-ml
          ref: d351c33caf7264a9ed5faf7ad6223c5b492b9fb1
          path: dag-ml-cli-src

      - uses: dtolnay/rust-toolchain@stable

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # PyPI's Linux wheel pulls CUDA/Triton dependencies even on a CPU
          # runner. Install the official CPU wheel so eager Torch tests do
          # not initialize the unsupported Triton runtime.
          grep -v '^torch' requirements-test.txt > requirements-test-linux.txt
          python -m pip install numpy -r requirements-test-linux.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.13.0+cpu'
          # The previous dependency resolution can leave an orphaned Triton
          # package behind. Torch probes it at optimizer creation even with a
          # CPU wheel; its import segfaulted repeatedly in the release runner.
          python -m pip uninstall -y triton
          python -c "import importlib.util; assert importlib.util.find_spec('triton') is None"

      - name: Install package (editable, no-deps — deps already from requirements-test.txt)
        run: python -m pip install -e . --no-deps

      - name: Build pinned dag-ml CLI for subprocess parity tests
        run: cargo build -p dag-ml-cli --manifest-path dag-ml-cli-src/Cargo.toml

      - name: Gate real library usability
        timeout-minutes: 5
        uses: ./.github/actions/library-usability

      - name: Run fast DAG-ML unit, API, and parity smoke tests
        shell: bash
        env:
          N4A_ENGINE: dag-ml
          N4A_DAGML_CLI: ${{ github.workspace }}/dag-ml-cli-src/target/debug/dag-ml-cli
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p fast-dagml-pytest-report
          python -m pytest -q --timeout=300 -n 2 --dist worksteal \
            -m 'not slow and not gpu and not stress' \
            tests/unit/ tests/integration/api/ \
            tests/integration/parity/test_parity_compiles.py \
            tests/integration/parity/test_cv_test_parity.py \
            tests/integration/parity/test_native_single_model_bundle_export.py \
            tests/integration/parity/test_conformance_examples_smoke.py \
            tests/integration/parity/test_marker_audit.py \
            --junitxml=fast-dagml-pytest-report/junit.xml \
            --cov=nirs4all --cov-report=xml

      - name: Upload fast DAG-ML pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-dagml-pytest-report
          path: |
            fast-dagml-pytest-report/
            coverage.xml
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        # Coverage is already uploaded by the PR CI. Codecov's OIDC endpoint
        # does not resolve release events reliably, and telemetry must not block
        # a package after the release tests themselves have passed.
        if: github.event_name != 'release'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  # Build and verify documentation
  build-docs:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt

      - name: Install nirs4all package
        run: python -m pip install -e .

      - name: Build documentation
        run: |
          cd docs
          sphinx-build -b html source _build/html --keep-going

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html/
          retention-days: 7

  # Release publication is blocked unless every dynamically discovered example
  # passes strict output checks (tracebacks, NaNs, and empty results).
  verify-examples:
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install example dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install jax jaxlib tensorflow
          python -m pip install -r requirements-examples.txt
          python -m pip install -e .

      - name: Run all strict examples once
        run: |
          cd examples
          chmod +x run_ci_examples.sh
          ./run_ci_examples.sh -c all -j 2 -k
        timeout-minutes: 45

  # Build distribution packages (after tests, docs, and examples pass)
  build:
    needs: [release-preflight, run-tests, build-docs, verify-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.release-preflight.outputs.release_tag) || github.ref }}

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify version consistency
        if: github.event_name == 'release' || inputs.publish_release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
        run: |
          set -euo pipefail
          # Version is single-sourced from nirs4all/__init__.py (pyproject declares it
          # dynamically via attr:), so read __version__ directly rather than pyproject.
          PKG_VERSION=$(grep -E '^__version__' nirs4all/__init__.py | cut -d'"' -f2)
          TAG_VERSION="$RELEASE_TAG"
          TAG_VERSION="${TAG_VERSION#v}"
          # Product RC tags use SemVer spelling (1.0.0-rc.1), while Python
          # package metadata uses the equivalent PEP 440 spelling (1.0.0rc1).
          TAG_VERSION="${TAG_VERSION//-rc./rc}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch: nirs4all.__version__=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          if [[ -n "$EXPECTED_TAG_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_TAG_SHA" ]]; then
            echo '::error::Release tag changed after preflight.'
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Build dists
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # Publish to PyPI (only after build succeeds, which requires tests + docs)
  publish-pypi:
    needs: build
    if: github.event_name == 'release' || inputs.publish_release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Verify the exact public artifact in a clean environment. This gate catches
  # packaging, dependency-resolution, and publication mistakes.
  post-publish-smoke:
    needs: [release-preflight, publish-pypi]
    if: github.event_name == 'release' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the exact PyPI release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          package_version="${RELEASE_TAG#v}"
          package_version="${package_version//-rc./rc}"
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir \
              --index-url https://pypi.org/simple/ "nirs4all==${package_version}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "::error::PyPI did not serve nirs4all==${package_version} after 6 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Verify installed metadata, native ABI, and DAG-ML execution
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from importlib.metadata import version

          import numpy as np
          import nirs4all
          import n4m
          from sklearn.linear_model import Ridge
          from sklearn.model_selection import KFold

          expected = os.environ["RELEASE_TAG"].removeprefix("v").replace("-rc.", "rc")
          assert version("nirs4all") == expected
          assert nirs4all.__version__ == expected
          assert n4m.abi_version()[:2] == (2, 6)

          rng = np.random.default_rng(42)
          X = rng.normal(size=(30, 8))
          y = X[:, 0] * 1.2 - X[:, 1] * 0.4 + rng.normal(scale=0.05, size=30)
          with nirs4all.run(
              [KFold(3), Ridge(alpha=1.0)],
              (X, y),
              engine="dag-ml",
              verbose=0,
              save_artifacts=False,
              save_charts=False,
          ) as result:
              assert result.execution_engine == "dag-ml"
              assert np.isfinite(result.cv_best_score)
          print(f"verified public nirs4all {expected}")
          PY
          python -m pip check

  # Build and push Docker image to GHCR after the release tag/version check.
  publish-docker:
    needs: [run-tests, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Notify about conda-forge feedstock update (after PyPI publish)
  notify-conda-forge:
    needs: [release-preflight, publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.publish_release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch SHA256 and generate conda-forge update instructions
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
        run: |
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"

          # Wait for PyPI to index the new version (up to 5 minutes)
          SHA256=""
          for i in $(seq 1 10); do
            SHA256=$(curl -sL "https://pypi.org/pypi/nirs4all/$VERSION/json" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); \
              print([u['digests']['sha256'] for u in d['urls'] if u['filename'].endswith('.tar.gz')][0])" 2>/dev/null) && break
            echo "Waiting for PyPI to index version $VERSION (attempt $i/10)..."
            sleep 30
          done

          echo "## Conda-forge Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -z "$SHA256" ]]; then
            echo "::warning::Could not fetch SHA256 from PyPI for version $VERSION"
            echo "Could not fetch SHA256 automatically. Update manually:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "python scripts/sync_conda_recipe.py --sha $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "The regro-cf-autotick-bot should automatically create a PR to the feedstock." >> $GITHUB_STEP_SUMMARY
            echo "If it doesn't within 24h, manually update:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "- **SHA256**: \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Or run:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "python scripts/sync_conda_recipe.py --sha $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            # Also update meta.yaml in the repo for reference
            python scripts/sync_conda_recipe.py --sha "$VERSION" || true
          fi
