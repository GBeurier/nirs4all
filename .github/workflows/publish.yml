# Registry publication is independent of GitHub Releases, docs, Docker and installers.
name: Publish Python package
'on':
  push:
    tags:
    - '[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SDK tag for manual registry publication
        required: false
        type: string
      publish_release:
        description: Publish the registry package from an existing tag (manual main only; legacy input name)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      tag_sha: ${{ steps.target.outputs.tag_sha }}
      publish_package: ${{ steps.target.outputs.publish_package }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Verify independent registry publication target
      id: target
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_REF_TYPE: ${{ github.ref_type }}
        EVENT_TAG: ${{ github.ref_name }}
        INPUT_TAG: ${{ inputs.release_tag }}
        PUBLISH_RELEASE: ${{ inputs.publish_release }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$PUBLISH_RELEASE" != 'true' ]]; then
          echo 'Manual dry-run: registry publication disabled.'
          echo 'publish_package=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$EVENT_NAME" == 'push' && "$EVENT_REF_TYPE" == 'tag' ]]; then
          tag="$EVENT_TAG"
        elif [[ "$EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
          tag="$INPUT_TAG"
        else
          echo '::error::Manual registry publication must run from main; automatic publication requires a tag push.'
          exit 1
        fi
        if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
          echo '::error::An existing immutable SemVer tag is required.'
          exit 1
        fi
        git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
        tag_sha=$(git rev-parse "$tag^{commit}")
        if [[ "$EVENT_NAME" == 'push' ]]; then
          event_sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          if [[ "$event_sha" != "$tag_sha" ]]; then
            echo '::error::Tag event does not match the immutable source.'
            exit 1
          fi
        else
          git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA"
        fi
        package_version="${tag//-rc./rc}"
        pypi_status=$(curl --retry 2 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nirs4all/$package_version/json")
        if [[ "$pypi_status" != '404' ]]; then
          echo "::error::PyPI returned HTTP $pypi_status; a new registry publication requires absence. Retry Docker independently after a successful package publication."
          exit 1
        fi
        printf 'publish_package=true\nrelease_tag=%s\ntag_sha=%s\n' "$tag" "$tag_sha" >> "$GITHUB_OUTPUT"
        echo "Verified immutable SDK tag $tag at $tag_sha; no GitHub Release or delivery artifact is required."
  build:
    needs: release-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ needs.release-preflight.outputs.tag_sha || github.sha }}
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Verify version consistency
      if: needs.release-preflight.outputs.publish_package == 'true'
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: |
        set -euo pipefail
        # Version is single-sourced from nirs4all/__init__.py (pyproject declares it
        # dynamically via attr:), so read __version__ directly rather than pyproject.
        PKG_VERSION=$(grep -E '^__version__' nirs4all/__init__.py | cut -d'"' -f2)
        TAG_VERSION="$RELEASE_TAG"
        TAG_VERSION="${TAG_VERSION#v}"
        # Product RC tags use SemVer spelling (1.0.0-rc.1), while Python
        # package metadata uses the equivalent PEP 440 spelling (1.0.0rc1).
        TAG_VERSION="${TAG_VERSION//-rc./rc}"
        if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
          echo "::error::Version mismatch: nirs4all.__version__=$PKG_VERSION tag=$TAG_VERSION"
          exit 1
        fi
        if [[ -n "$EXPECTED_TAG_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_TAG_SHA" ]]; then
          echo '::error::Release tag changed after preflight.'
          exit 1
        fi
        echo "Version verified: $PKG_VERSION"
    - name: Build the qualified distributions
      shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        qualified = json.loads(Path("qualification/release-artifacts.json").read_text())
        source = qualified["source_sha"]
        subprocess.run(["git", "merge-base", "--is-ancestor", source, "HEAD"], check=True)
        epoch = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", source], text=True))
        if epoch != qualified["source_date_epoch"]:
            raise SystemExit("Qualified source timestamp differs from its immutable commit")
        subprocess.run([sys.executable, "-m", "pip", "install", *qualified["build_requirements"]], check=True)
        environment = {**os.environ, "SOURCE_DATE_EPOCH": str(epoch), "PYTHONHASHSEED": "0"}
        subprocess.run([sys.executable, "-m", "build", "--no-isolation", "--sdist", "--wheel", "--outdir", "dist"], env=environment, check=True)
        expected = qualified["wheel"]
        wheel = Path("dist") / expected["filename"]
        if wheel.stat().st_size != expected["bytes"] or hashlib.sha256(wheel.read_bytes()).hexdigest() != expected["sha256"]:
            raise SystemExit("Built SDK wheel differs from the qualified release artifact")
        print("Qualified SDK wheel reproduced exactly:", expected["sha256"])
        PY
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist
  publish-pypi:
    needs:
    - release-preflight
    - build
    - package-smoke
    if: needs.release-preflight.outputs.publish_package == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
  post-publish-smoke:
    needs:
    - release-preflight
    - publish-pypi
    if: needs.release-preflight.outputs.publish_package == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.release-preflight.outputs.release_tag }}
    - name: Verify exact post-publication source
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install the exact PyPI release
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
      run: |
        set -euo pipefail
        package_version="${RELEASE_TAG#v}"
        package_version="${package_version//-rc./rc}"
        python -m pip install --upgrade pip
        for attempt in 1 2 3 4 5 6; do
          if python -m pip install --no-cache-dir \
            --index-url https://pypi.org/simple/ "nirs4all==${package_version}"; then
            break
          fi
          if [ "${attempt}" -eq 6 ]; then
            echo "::error::PyPI did not serve nirs4all==${package_version} after 6 attempts"
            exit 1
          fi
          sleep 10
        done
    - name: Verify public installed package metadata, origins and native ABI
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install nirs4all-methods==1.5.1
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
  notify-conda-forge:
    needs:
    - release-preflight
    - publish-pypi
    runs-on: ubuntu-latest
    if: needs.release-preflight.outputs.publish_package == 'true'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch SHA256 and generate conda-forge update instructions
      shell: bash
      env:
        RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
      run: |
        VERSION="$RELEASE_TAG"
        VERSION="${VERSION#v}"

        # Wait for PyPI to index the new version (up to 5 minutes)
        SHA256=""
        for i in $(seq 1 10); do
          SHA256=$(curl -sL "https://pypi.org/pypi/nirs4all/$VERSION/json" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); \
            print([u['digests']['sha256'] for u in d['urls'] if u['filename'].endswith('.tar.gz')][0])" 2>/dev/null) && break
          echo "Waiting for PyPI to index version $VERSION (attempt $i/10)..."
          sleep 30
        done

        echo "## Conda-forge Update" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ -z "$SHA256" ]]; then
          echo "::warning::Could not fetch SHA256 from PyPI for version $VERSION"
          echo "Could not fetch SHA256 automatically. Update manually:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "python scripts/sync_conda_recipe.py --sha $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "The regro-cf-autotick-bot should automatically create a PR to the feedstock." >> $GITHUB_STEP_SUMMARY
          echo "If it doesn't within 24h, manually update:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or run:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "python scripts/sync_conda_recipe.py --sha $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          # Also update meta.yaml in the repo for reference
          python scripts/sync_conda_recipe.py --sha "$VERSION" || true
        fi
  package-smoke:
    needs:
    - release-preflight
    - build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.release-preflight.outputs.tag_sha || github.sha }}
    - name: Verify checked out commit matches publication target
      if: needs.release-preflight.outputs.publish_package == 'true'
      env:
        EXPECTED_TAG_SHA: ${{ needs.release-preflight.outputs.tag_sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_TAG_SHA"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Install built wheel
      run: python -m pip install dist/*.whl nirs4all-methods==1.5.1
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
