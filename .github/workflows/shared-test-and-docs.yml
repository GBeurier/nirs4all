# Full scientific suites and examples run locally before publication.
name: "Shared \u2013 Test and Docs"
'on':
  workflow_call:
    inputs:
      fail-fast:
        description: Retained compatibility input (the suite is no longer matrixed)
        type: boolean
        default: true
      skip-tests:
        description: Skip the test suite (docs only)
        type: boolean
        default: false
      upload-coverage:
        description: Upload coverage report to Codecov
        type: boolean
        default: false
      docs-artifact-name:
        description: Name for the documentation artifact
        type: string
        default: documentation-html
      docs-retention-days:
        description: Days to retain the documentation artifact
        type: number
        default: 7
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade build twine
        python -m build --sdist --wheel --outdir dist
        python -m twine check dist/*
    - name: Install built wheel
      run: python -m pip install dist/*.whl
    - name: Verify installed package metadata, origins and native ABI
      shell: bash
      run: |
        source_root="$PWD"
        cd "$RUNNER_TEMP"
        python "$source_root/scripts/smoke_installed_package.py" --source-root "$source_root"
        python -m pip check
    - uses: actions/upload-artifact@v7
      with:
        name: sdk-dist-smoke
        path: dist/
        if-no-files-found: error
    if: ${{ !inputs.skip-tests }}
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r docs/readthedocs.requirements.txt
    - name: Install nirs4all package
      run: python -m pip install -e .
    - name: Build documentation
      run: |
        cd docs
        sphinx-build -b html source _build/html --keep-going
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.docs-artifact-name }}
        path: docs/_build/html/
        retention-days: ${{ inputs.docs-retention-days }}
