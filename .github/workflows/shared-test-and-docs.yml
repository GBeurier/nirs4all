# .github/workflows/shared-test-and-docs.yml
# Reusable workflow: one complete test suite + documentation build.
# Called by pre-publish.yml and publish.yml via workflow_call.
name: Shared – Test and Docs

on:
  workflow_call:
    inputs:
      fail-fast:
        description: 'Retained compatibility input (the suite is no longer matrixed)'
        type: boolean
        default: true
      skip-tests:
        description: 'Skip the test suite (docs only)'
        type: boolean
        default: false
      upload-coverage:
        description: 'Upload coverage report to Codecov'
        type: boolean
        default: false
      docs-artifact-name:
        description: 'Name for the documentation artifact'
        type: string
        default: 'documentation-html'
      docs-retention-days:
        description: 'Days to retain the documentation artifact'
        type: number
        default: 7

jobs:
  run-tests:
    if: ${{ !inputs.skip-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned dag-ml CLI source
        uses: actions/checkout@v6
        with:
          repository: GBeurier/dag-ml
          ref: ff4bb34cfaea5563513be148c0f4ea7907e2e541
          path: dag-ml-cli-src

      - uses: dtolnay/rust-toolchain@stable

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Keep Linux tests on the official CPU wheel. The PyPI wheel pulls
          # CUDA/Triton even on CPU runners, which is not a valid test target.
          grep -v '^torch' requirements-test.txt > requirements-test-linux.txt
          python -m pip install numpy -r requirements-test-linux.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.13.0+cpu'

      - name: Install package (editable, no-deps — deps already from requirements-test.txt)
        run: python -m pip install -e . --no-deps

      - name: Build pinned dag-ml CLI for parity tests
        run: cargo build -p dag-ml-cli --manifest-path dag-ml-cli-src/Cargo.toml

      - name: Gate real library usability
        timeout-minutes: 5
        uses: ./.github/actions/library-usability

      - name: Run full pytest + coverage
        shell: bash
        env:
          N4A_ENGINE: dag-ml
        run: |
          python -m coverage erase
          python -m pytest -v --timeout=300 -n 0 \
            tests/integration/pipeline/test_merge_mixed.py \
            tests/integration/pipeline/test_merge_per_branch.py \
            --cov=nirs4all --cov-append
          python -m pytest -v --timeout=300 -n 0 \
            tests/integration/parity/test_conformance_dual_engine.py \
            --cov=nirs4all --cov-append
          N4A_DAGML_CLI="$GITHUB_WORKSPACE/dag-ml-cli-src/target/debug/dag-ml-cli" \
            python -m pytest -v --timeout=300 -n 0 \
            tests/integration/parity/test_dagml_cli_runner.py \
            tests/integration/parity/test_dagml_native_n4a_bundle.py \
            tests/integration/parity/test_dagml_run_selector.py \
            tests/integration/parity/test_dagml_native_export_model.py \
            tests/integration/parity/test_dagml_native_results.py \
            tests/integration/parity/test_rt_fallback_strict.py \
            tests/integration/parity/test_native_single_model_bundle_export.py \
            --cov=nirs4all --cov-append
          XLA_PYTHON_CLIENT_PREALLOCATE=false TF_FORCE_GPU_ALLOW_GROWTH=true \
            python -m pytest -v --timeout=300 -n 0 -m gpu tests/ \
            --ignore=tests/integration/parity/test_conformance_dual_engine.py \
            --ignore=tests/integration/parity/test_dagml_cli_runner.py \
            --ignore=tests/integration/parity/test_dagml_native_n4a_bundle.py \
            --ignore=tests/integration/parity/test_dagml_run_selector.py \
            --ignore=tests/integration/parity/test_dagml_native_export_model.py \
            --ignore=tests/integration/parity/test_dagml_native_results.py \
            --ignore=tests/integration/parity/test_rt_fallback_strict.py \
            --ignore=tests/integration/parity/test_native_single_model_bundle_export.py \
            --cov=nirs4all --cov-append
          CUDA_VISIBLE_DEVICES='' XLA_PYTHON_CLIENT_PREALLOCATE=false TF_FORCE_GPU_ALLOW_GROWTH=true \
            python -m pytest -v --timeout=300 -n 2 --dist loadfile -m 'not gpu' tests/ \
            --ignore=tests/integration/pipeline/test_merge_mixed.py \
            --ignore=tests/integration/pipeline/test_merge_per_branch.py \
            --ignore=tests/integration/parity/test_conformance_dual_engine.py \
            --ignore=tests/integration/parity/test_dagml_cli_runner.py \
            --ignore=tests/integration/parity/test_dagml_native_n4a_bundle.py \
            --ignore=tests/integration/parity/test_dagml_run_selector.py \
            --ignore=tests/integration/parity/test_dagml_native_export_model.py \
            --ignore=tests/integration/parity/test_dagml_native_results.py \
            --ignore=tests/integration/parity/test_rt_fallback_strict.py \
            --ignore=tests/integration/parity/test_native_single_model_bundle_export.py \
            --ignore=tests/integration/parity/test_dagml_torch_models.py \
            --ignore=tests/unit/operators/models/test_pytorch.py \
            --ignore=tests/unit/controllers/models/test_model_file_loading.py \
            --ignore=tests/unit/pipeline/bundle/test_bundle_controller_prediction.py \
            --ignore=tests/unit/controllers/models/test_torch_multioutput.py \
            --ignore=tests/unit/pipeline/dagml/test_gpu_resources.py \
            --ignore=tests/unit/pipeline/test_resolver.py \
            --ignore=tests/integration/parity/test_dagml_gpu.py \
            --cov=nirs4all --cov-append
          # Keep each PyTorch test module in a fresh process: TensorFlow/JAX and
          # PyTorch native runtimes can crash when loaded together.
          for test_file in \
            tests/integration/parity/test_dagml_torch_models.py \
            tests/unit/operators/models/test_pytorch.py \
            tests/unit/controllers/models/test_model_file_loading.py \
            tests/unit/pipeline/bundle/test_bundle_controller_prediction.py \
            tests/unit/controllers/models/test_torch_multioutput.py \
            tests/unit/pipeline/dagml/test_gpu_resources.py \
            tests/unit/pipeline/test_resolver.py; do
            CUDA_VISIBLE_DEVICES='' XLA_PYTHON_CLIENT_PREALLOCATE=false TF_FORCE_GPU_ALLOW_GROWTH=true \
              python -m pytest -v --timeout=300 -n 0 -m 'not gpu' "$test_file" \
              --cov=nirs4all --cov-append
          done
          python -m coverage xml

      - name: Upload coverage to Codecov
        if: ${{ inputs.upload-coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r docs/readthedocs.requirements.txt

      - name: Install nirs4all package
        run: python -m pip install -e .

      - name: Build documentation
        run: |
          cd docs
          sphinx-build -b html source _build/html --keep-going

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.docs-artifact-name }}
          path: docs/_build/html/
          retention-days: ${{ inputs.docs-retention-days }}
