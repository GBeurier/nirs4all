{% set name = "nirs4all" %}
{% set version = "1.0.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  # Pre-publication placeholder from the last published recipe. Replace with
  # the exact 1.0.1 PyPI sdist digest immediately after trusted publication:
  # python scripts/sync_conda_recipe.py --sha 1.0.1
  sha256: 2e239673ae8c99df368d53f0c2ac5600510209284988667995eebd46248d884d

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - nirs4all = nirs4all.cli.main:main

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python >={{ python_min }}
    # Core scientific computing
    - numpy >=2.0.0
    - pandas >=2.2.2
    - scipy >=1.13.0
    - scikit-learn >=1.5.0
    # Data processing
    - polars >=1.0.0
    - pyarrow >=14.0.0
    - h5py >=3.8.0
    # Signal processing
    - pywavelets >=1.4.0
    - pybaselines >=1.2.1
    # Optimization
    - optuna >=3.0.0
    # Utilities
    - joblib >=1.2.0
    - jsonschema >=4.18.0
    - referencing >=0.30.0
    - pyyaml >=6.0.0
    - packaging >=23.0
    - pydantic >=2.0.0
    # NIRS-specific
    - kennard-stone >=2.2.0
    # Advanced PLS variants
    - ikpls >=1.1.0
    - pyopls >=20.0
    - trendfitter >=0.0.6
    # Published V1 execution and dataset stack
    - dag-ml >=0.3.25,<0.4
    - dag-ml-data >=0.2.11,<0.3
    - nirs4all-io >=0.1.18,<0.2
    - nirs4all-core >=0.3.29,<0.4
    - nirs4all-methods >=1.0.18,<2
  # Optional dependencies, mirroring the wheel's pip extras (nirs4all[viz],
  # nirs4all[explain]). Not required to import nirs4all; constrained here only
  # so that, if present, they satisfy the same floors as the extras.
  run_constrained:
    - matplotlib-base >=3.7.0
    - shap >=0.42.0

test:
  imports:
    - nirs4all
  commands:
    - pip check
    - nirs4all --help
  requires:
    - pip

about:
  home: https://github.com/GBeurier/nirs4all
  summary: A comprehensive Python library for Near-Infrared Spectroscopy (NIRS) data analysis with ML/DL pipelines.
  doc_url: https://nirs4all.readthedocs.io
  dev_url: https://github.com/GBeurier/nirs4all
  license: AGPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - GBeurier
