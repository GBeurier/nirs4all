<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Add training variations; keep validation unchanged</title><desc id="description">Two generated versions of each training observation share its original sample identity.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Add training variations; keep validation unchanged</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Two generated versions of each training observation share its original sample identity.</text>
<rect x="40" y="175" width="333" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="175" width="7" height="157" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="217" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Before</text>
<text x="64" y="254" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">8 original training rows</text>
<text x="64" y="283" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">4 held-out validation rows</text>
<rect x="432" y="175" width="335" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="432" y="175" width="7" height="157" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="456" y="217" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Create two variations</text>
<text x="456" y="254" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">8 × 2 = 16 generated rows</text>
<text x="456" y="283" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Keep the 8 original rows</text>
<rect x="826" y="175" width="334" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="826" y="175" width="7" height="157" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="850" y="217" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">After</text>
<text x="850" y="254" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">24 rows used for fitting</text>
<text x="850" y="283" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Still 4 validation rows</text>
<path d="M381,253 L422,253" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M775,253 L816,253" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="44" y="399" font-size="23" font-weight="600" text-anchor="start" style="fill:#162C46">One original sample and its copies stay in the same training fold</text>
<rect x="40" y="432" width="348" height="40" rx="10" fill="white" stroke="#1463A0"/>
<text x="214" y="459" font-size="19" font-weight="600" text-anchor="middle" style="fill:#1463A0">A · original</text>
<rect x="420" y="432" width="348" height="40" rx="10" fill="white" stroke="#7150A5"/>
<text x="594" y="459" font-size="19" font-weight="600" text-anchor="middle" style="fill:#7150A5">A · noisy version 1</text>
<rect x="800" y="432" width="348" height="40" rx="10" fill="white" stroke="#7150A5"/>
<text x="974" y="459" font-size="19" font-weight="600" text-anchor="middle" style="fill:#7150A5">A · noisy version 2</text>
<text x="44" y="520" font-size="21" font-weight="400" text-anchor="start" style="fill:#4C6278">Three rows; one independent origin. The label relationship must remain valid.</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">More training rows, not more independent evidence. No synthetic copies appear during prediction.</text>
</svg>
