<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Choose preprocessing for instrument transfer</title><desc id="description">Compare source measurements with an explicit target-instrument adaptation cohort.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Choose preprocessing for instrument transfer</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Compare source measurements with an explicit target-instrument adaptation cohort.</text>
<rect x="40" y="158" width="371" height="146" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="158" width="7" height="146" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="200" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Source instrument</text>
<text x="64" y="237" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">40 observations × 31 features</text>
<text x="64" y="266" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Original calibration cohort</text>
<rect x="40" y="365" width="371" height="146" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="365" width="7" height="146" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="64" y="407" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Target instrument</text>
<text x="64" y="444" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">8 observations × 31 features</text>
<text x="64" y="473" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Explicit adaptation cohort</text>
<rect x="483" y="254" width="306" height="179" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="483" y="254" width="7" height="179" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="507" y="296" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Selector</text>
<text x="507" y="333" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Compare candidate recipes</text>
<text x="507" y="362" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Measure transfer</text>
<text x="507" y="391" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">criterion</text>
<text x="507" y="420" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Choose a recommendation</text>
<rect x="865" y="254" width="295" height="179" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="865" y="254" width="7" height="179" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="889" y="296" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Selected transform</text>
<text x="889" y="333" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">One recommendation</text>
<text x="889" y="362" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Then fit the predictor</text>
<text x="889" y="391" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Validate unseen target</text>
<text x="889" y="420" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">rows</text>
<path d="M418,237 L473,314" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M418,436 L473,367" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M796,335 L854,335" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">One preprocessing recommendation. It does not guarantee better target-instrument predictions.</text>
</svg>
