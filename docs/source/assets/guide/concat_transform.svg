<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Join different representations of the same samples</title><desc id="description">Sample rows stay aligned. Each path creates its own feature columns.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Join different representations of the same samples</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Sample rows stay aligned. Each path creates its own feature columns.</text>
<rect x="40" y="251" width="250" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="251" width="7" height="157" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="293" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Raw input</text>
<text x="64" y="330" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples</text>
<text x="64" y="359" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">31 spectral features</text>
<rect x="380" y="155" width="366" height="135" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="380" y="155" width="7" height="135" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="404" y="197" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Path 1 · SNV</text>
<text x="404" y="234" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples × 31 features</text>
<rect x="380" y="360" width="366" height="145" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="380" y="360" width="7" height="145" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="404" y="402" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Path 2</text>
<text x="404" y="439" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">PCA: keep 3 components</text>
<text x="404" y="468" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples × 3 features</text>
<path d="M294,326 L370,230" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M294,332 L370,430" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="858" y="251" width="302" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="858" y="251" width="7" height="157" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="882" y="293" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Join columns</text>
<text x="882" y="330" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">31 + 3 = 34 features</text>
<text x="882" y="359" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Output: 48 × 34</text>
<path d="M752,230 L847,318" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M752,430 L847,342" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 rows are preserved. The final model receives 34 columns per sample.</text>
</svg>
