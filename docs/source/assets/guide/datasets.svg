<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Join measurements by sample ID</title><desc id="description">Files may have different row orders. IDs tell you which observations belong together.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Join measurements by sample ID</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Files may have different row orders. IDs tell you which observations belong together.</text>
<text x="40" y="150" font-size="23" font-weight="700" text-anchor="start" style="fill:#162C46">Two input files</text>
<rect x="40" y="172" width="290" height="176" rx="10" fill="white" stroke="#D9E2EC"/>
<rect x="40" y="172" width="290" height="44" rx="10" fill="#EAF0F7" stroke="#D9E2EC"/>
<text x="56" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Spectrum ID</text>
<text x="226" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Peak</text>
<text x="56" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">A</text>
<text x="226" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0.42</text>
<text x="56" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">B</text>
<text x="226" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0.57</text>
<text x="56" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">C</text>
<text x="226" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0.31</text>
<rect x="360" y="172" width="270" height="176" rx="10" fill="white" stroke="#D9E2EC"/>
<rect x="360" y="172" width="270" height="44" rx="10" fill="#EAF0F7" stroke="#D9E2EC"/>
<text x="376" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Lab ID</text>
<text x="521" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Target</text>
<text x="376" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">C</text>
<text x="521" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">12</text>
<text x="376" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">A</text>
<text x="521" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">18</text>
<text x="376" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">B</text>
<text x="521" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">25</text>
<path d="M650,265 L742,265" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="668" y="235" font-size="18" font-weight="400" text-anchor="start" style="fill:#007B71">join by ID</text>
<rect x="770" y="172" width="390" height="176" rx="10" fill="white" stroke="#D9E2EC"/>
<rect x="770" y="172" width="390" height="44" rx="10" fill="#EAF0F7" stroke="#D9E2EC"/>
<text x="786" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">ID</text>
<text x="886" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Peak</text>
<text x="1031" y="201" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Target</text>
<text x="786" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">A</text>
<text x="886" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0.42</text>
<text x="1031" y="245" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">18</text>
<text x="786" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">B</text>
<text x="886" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0.57</text>
<text x="1031" y="289" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">25</text>
<text x="786" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">C</text>
<text x="886" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0.31</text>
<text x="1031" y="333" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">12</text>
<rect x="40" y="407" width="536" height="145" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="407" width="7" height="145" rx="3" fill="#A64C12" stroke="#A64C12"/>
<text x="64" y="449" font-size="23" font-weight="700" text-anchor="start" style="fill:#A64C12">Position alone gives wrong labels</text>
<text x="64" y="486" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">First row A is not first row C.</text>
<text x="64" y="515" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">A positional join would give A target 12.</text>
<rect x="614" y="407" width="546" height="145" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="614" y="407" width="7" height="145" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="638" y="449" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Several modalities, one sample</text>
<text x="638" y="486" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">A spectrum, image and metadata describe A.</text>
<text x="638" y="515" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Keep IDs and presence information together.</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">A has target 18, B has target 25 and C has target 12, regardless of file order.</text>
</svg>
