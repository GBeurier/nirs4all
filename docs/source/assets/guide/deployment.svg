<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Save fitted state, then predict fresh samples</title><desc id="description">A recipe describes what to fit. An artifact contains the learned values needed for prediction.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Save fitted state, then predict fresh samples</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">A recipe describes what to fit. An artifact contains the learned values needed for prediction.</text>
<rect x="40" y="156" width="530" height="171" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="156" width="7" height="171" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="198" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Recipe · instructions</text>
<text x="64" y="235" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Use MSC, then a Ridge model</text>
<text x="64" y="264" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Parameters describe how training should run</text>
<text x="64" y="293" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">No fitted reference or model coefficients</text>
<rect x="630" y="156" width="530" height="171" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="630" y="156" width="7" height="171" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="654" y="198" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Artifact · learned state</text>
<text x="654" y="235" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">The training MSC reference spectrum</text>
<text x="654" y="264" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">The fitted model coefficients</text>
<text x="654" y="293" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Feature order, source schema and target units</text>
<path d="M578,237 L620,237" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="584" y="210" font-size="18" font-weight="400" text-anchor="start" style="fill:#4C6278">FIT</text>
<rect x="40" y="396" width="331" height="154" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="396" width="7" height="154" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="438" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Fresh measurements</text>
<text x="64" y="475" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Same source and feature</text>
<text x="64" y="504" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">schema</text>
<text x="64" y="533" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">No target labels needed</text>
<path d="M379,468 L424,468" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="435" y="396" width="331" height="154" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="435" y="396" width="7" height="154" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="459" y="438" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">LOAD → PREDICT</text>
<text x="459" y="475" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Reuse saved preprocessing</text>
<text x="459" y="504" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Reuse saved model state</text>
<path d="M774,468 L819,468" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="830" y="396" width="331" height="154" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="830" y="396" width="7" height="154" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="854" y="438" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Predictions</text>
<text x="854" y="475" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">One output per sample ID</text>
<text x="854" y="504" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">In original target units</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Loading the predictor does not run a new experiment or choose a new preprocessing recipe.</text>
</svg>
