<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Split specimens, not their repeated scans</title><desc id="description">Repeated measurements of the same physical specimen stay together during validation.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Split specimens, not their repeated scans</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Repeated measurements of the same physical specimen stay together during validation.</text>
<rect x="40" y="155" width="533" height="126" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="155" width="7" height="126" rx="3" fill="#A64C12" stroke="#A64C12"/>
<text x="64" y="197" font-size="23" font-weight="700" text-anchor="start" style="fill:#A64C12">Same specimens on both sides</text>
<text x="65" y="323" font-size="21" font-weight="700" text-anchor="start" style="fill:#007B71">TRAIN</text>
<text x="340" y="323" font-size="21" font-weight="700" text-anchor="start" style="fill:#A64C12">VALIDATE</text>
<rect x="60" y="345" width="232" height="40" rx="10" fill="white" stroke="#007B71"/>
<text x="176" y="372" font-size="19" font-weight="600" text-anchor="middle" style="fill:#007B71">A · scan 1</text>
<rect x="60" y="402" width="232" height="40" rx="10" fill="white" stroke="#007B71"/>
<text x="176" y="429" font-size="19" font-weight="600" text-anchor="middle" style="fill:#007B71">B · scan 1</text>
<rect x="60" y="459" width="232" height="40" rx="10" fill="white" stroke="#007B71"/>
<text x="176" y="486" font-size="19" font-weight="600" text-anchor="middle" style="fill:#007B71">C · scan 1</text>
<rect x="333" y="345" width="224" height="40" rx="10" fill="white" stroke="#A64C12"/>
<text x="445" y="372" font-size="19" font-weight="600" text-anchor="middle" style="fill:#A64C12">A · scan 2</text>
<rect x="333" y="402" width="224" height="40" rx="10" fill="white" stroke="#A64C12"/>
<text x="445" y="429" font-size="19" font-weight="600" text-anchor="middle" style="fill:#A64C12">B · scan 2</text>
<rect x="333" y="459" width="224" height="40" rx="10" fill="white" stroke="#A64C12"/>
<text x="445" y="486" font-size="19" font-weight="600" text-anchor="middle" style="fill:#A64C12">C · scan 2</text>
<path d="M312,330 L312,524" fill="none" stroke="#A8B6C5" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="627" y="155" width="533" height="126" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="627" y="155" width="7" height="126" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="651" y="197" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Whole specimens held out</text>
<text x="652" y="323" font-size="21" font-weight="700" text-anchor="start" style="fill:#007B71">TRAIN</text>
<text x="927" y="323" font-size="21" font-weight="700" text-anchor="start" style="fill:#A64C12">VALIDATE</text>
<rect x="647" y="345" width="232" height="40" rx="10" fill="white" stroke="#007B71"/>
<text x="763" y="372" font-size="19" font-weight="600" text-anchor="middle" style="fill:#007B71">A · scans 1 + 2</text>
<rect x="647" y="402" width="232" height="40" rx="10" fill="white" stroke="#007B71"/>
<text x="763" y="429" font-size="19" font-weight="600" text-anchor="middle" style="fill:#007B71">B · scans 1 + 2</text>
<rect x="920" y="345" width="224" height="40" rx="10" fill="white" stroke="#A64C12"/>
<text x="1032" y="372" font-size="19" font-weight="600" text-anchor="middle" style="fill:#A64C12">C · scans 1 + 2</text>
<path d="M899,330 L899,524" fill="none" stroke="#A8B6C5" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">On the right, validation measures predictions for specimen C, which the model has never seen.</text>
</svg>
