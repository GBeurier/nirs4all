<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Keep several feature views of every spectrum</title><desc id="description">Three views describe the same 48 samples. This does not create new samples.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Keep several feature views of every spectrum</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Three views describe the same 48 samples. This does not create new samples.</text>
<rect x="40" y="255" width="265" height="142" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="255" width="7" height="142" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="297" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Input spectra</text>
<text x="64" y="334" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples × 31</text>
<text x="64" y="363" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">features</text>
<rect x="391" y="150" width="353" height="115" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="391" y="150" width="7" height="115" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="415" y="192" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Original</text>
<text x="415" y="229" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples × 31 features</text>
<path d="M312,325 L381,205" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,205 L822,325" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="391" y="295" width="353" height="115" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="391" y="295" width="7" height="115" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="415" y="337" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">SNV</text>
<text x="415" y="374" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples × 31 features</text>
<path d="M312,325 L381,350" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,350 L822,325" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="391" y="440" width="353" height="115" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="391" y="440" width="7" height="115" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="415" y="482" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">First derivative</text>
<text x="415" y="519" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples × 31 features</text>
<path d="M312,325 L381,495" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,495 L822,325" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="833" y="255" width="327" height="142" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="833" y="255" width="7" height="142" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="857" y="297" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Tracked views</text>
<text x="857" y="334" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Shape: 48 × 3 × 31</text>
<text x="857" y="363" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">sample × view × feature</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 samples remain. Flattening the three views would produce 93 feature columns per sample.</text>
</svg>
