<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
<title id="title">A generator turns choices into complete recipes</title><desc id="description">Two preprocessing choices × three PLS component counts = six separate experiments</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="840" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">A generator turns choices into complete recipes</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Two preprocessing choices × three PLS component counts = six separate experiments</text>
<rect x="40" y="135" width="332" height="165" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="135" width="7" height="165" rx="3" fill="#1463A0" stroke="#1463A0"/>
<rect x="61" y="153" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="176" font-size="19" font-weight="700" text-anchor="middle" style="fill:#1463A0">A</text>
<text x="110" y="177" font-size="21" font-weight="700" text-anchor="start" style="fill:#1463A0">Preprocessing choices</text>
<text x="64" y="214" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">SNV</text>
<text x="64" y="243" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">StandardScaler</text>
<rect x="432" y="135" width="330" height="165" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="432" y="135" width="7" height="165" rx="3" fill="#7150A5" stroke="#7150A5"/>
<rect x="453" y="153" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="470" y="176" font-size="19" font-weight="700" text-anchor="middle" style="fill:#7150A5">B</text>
<text x="502" y="177" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Component choices</text>
<text x="456" y="214" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">PLS: 2, 3 or 4 components</text>
<text x="456" y="243" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Try every value for each</text>
<text x="456" y="272" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">choice</text>
<path d="M380,218 L420,218" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="822" y="135" width="338" height="165" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="822" y="135" width="7" height="165" rx="3" fill="#007B71" stroke="#007B71"/>
<rect x="843" y="153" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="860" y="176" font-size="19" font-weight="700" text-anchor="middle" style="fill:#007B71">C</text>
<text x="892" y="177" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Expand</text>
<text x="846" y="214" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">2 × 3 = 6 complete recipes</text>
<text x="846" y="243" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Keep data and folds fixed</text>
<path d="M770,218 L810,218" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="44" y="348" font-size="23" font-weight="600" text-anchor="start" style="fill:#162C46">Each card below is one pipeline. Fit and compare all six.</text>
<rect x="40" y="380" width="360" height="131" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="380" width="7" height="131" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="422" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Recipe 1</text>
<text x="64" y="459" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">SNV → PLS(2)</text>
<text x="64" y="488" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit on the same training folds</text>
<rect x="420" y="380" width="360" height="131" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="420" y="380" width="7" height="131" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="444" y="422" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Recipe 2</text>
<text x="444" y="459" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">SNV → PLS(3)</text>
<text x="444" y="488" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit on the same training folds</text>
<rect x="800" y="380" width="360" height="131" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="800" y="380" width="7" height="131" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="824" y="422" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Recipe 3</text>
<text x="824" y="459" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">SNV → PLS(4)</text>
<text x="824" y="488" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit on the same training folds</text>
<rect x="40" y="535" width="360" height="131" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="535" width="7" height="131" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="64" y="577" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Recipe 4</text>
<text x="64" y="614" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">StandardScaler → PLS(2)</text>
<text x="64" y="643" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit on the same training folds</text>
<rect x="420" y="535" width="360" height="131" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="420" y="535" width="7" height="131" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="444" y="577" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Recipe 5</text>
<text x="444" y="614" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">StandardScaler → PLS(3)</text>
<text x="444" y="643" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit on the same training folds</text>
<rect x="800" y="535" width="360" height="131" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="800" y="535" width="7" height="131" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="824" y="577" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Recipe 6</text>
<text x="824" y="614" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">StandardScaler → PLS(4)</text>
<text x="824" y="643" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit on the same training folds</text>
<rect x="40" y="724" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="751" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="777" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Six evaluated recipes. Compare validation error, choose one recipe, then refit that recipe.</text>
</svg>
