<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">Choose a merge that matches your branch outputs</title><desc id="description">Features, predictions, sources and routed rows describe different kinds of joins.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="820" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Choose a merge that matches your branch outputs</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Features, predictions, sources and routed rows describe different kinds of joins.</text>
<rect x="40" y="143" width="247" height="111" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="143" width="7" height="111" rx="3" fill="#1463A0" stroke="#1463A0"/>
<rect x="61" y="161" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="184" font-size="19" font-weight="700" text-anchor="middle" style="fill:#1463A0">1</text>
<text x="110" y="185" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Features</text>
<text x="320" y="177" font-size="21" font-weight="400" text-anchor="start" style="fill:#162C46">Same rows; different transformed features</text>
<path d="M323,203 L390,203" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="422" y="210" font-size="24" font-weight="600" text-anchor="start" style="fill:#1463A0">48 × 31 + 48 × 31 → 48 × 62</text>
<rect x="40" y="276" width="247" height="111" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="276" width="7" height="111" rx="3" fill="#7150A5" stroke="#7150A5"/>
<rect x="61" y="294" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="317" font-size="19" font-weight="700" text-anchor="middle" style="fill:#7150A5">2</text>
<text x="110" y="318" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Predictions</text>
<text x="320" y="310" font-size="21" font-weight="400" text-anchor="start" style="fill:#162C46">One held-out prediction per base model</text>
<path d="M323,336 L390,336" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="422" y="343" font-size="24" font-weight="600" text-anchor="start" style="fill:#7150A5">48 × 1 + 48 × 1 → 48 × 2</text>
<rect x="40" y="409" width="247" height="111" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="409" width="7" height="111" rx="3" fill="#007B71" stroke="#007B71"/>
<rect x="61" y="427" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="450" font-size="19" font-weight="700" text-anchor="middle" style="fill:#007B71">3</text>
<text x="110" y="451" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Sources</text>
<text x="320" y="443" font-size="21" font-weight="400" text-anchor="start" style="fill:#162C46">Different sensors for the same samples</text>
<path d="M323,469 L390,469" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="422" y="476" font-size="24" font-weight="600" text-anchor="start" style="fill:#007B71">48 × 31 + 48 × 3 → 48 × 34</text>
<rect x="40" y="542" width="247" height="111" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="542" width="7" height="111" rx="3" fill="#A64C12" stroke="#A64C12"/>
<rect x="61" y="560" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="583" font-size="19" font-weight="700" text-anchor="middle" style="fill:#A64C12">4</text>
<text x="110" y="584" font-size="23" font-weight="700" text-anchor="start" style="fill:#A64C12">Reassembly</text>
<text x="320" y="576" font-size="21" font-weight="400" text-anchor="start" style="fill:#162C46">Subsets routed through different branches</text>
<path d="M323,602 L390,602" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="422" y="609" font-size="24" font-weight="600" text-anchor="start" style="fill:#A64C12">20 rows + 28 rows → 48 original IDs</text>
<rect x="40" y="704" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="731" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="757" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Feature/source joins add columns. Reassembly restores rows. Prediction joins create meta-features.</text>
</svg>
