<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Each operator performs one operation</title><desc id="description">The class identifies the operation; parameters control what it does to the data.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Each operator performs one operation</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">The class identifies the operation; parameters control what it does to the data.</text>
<rect x="40" y="198" width="328" height="178" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="198" width="7" height="178" rx="3" fill="#1463A0" stroke="#1463A0"/>
<rect x="61" y="216" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="239" font-size="19" font-weight="700" text-anchor="middle" style="fill:#1463A0">1</text>
<text x="110" y="240" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">StandardScaler</text>
<text x="64" y="277" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 × 31 → 48 × 31</text>
<text x="64" y="306" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Learn column means and</text>
<text x="64" y="335" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">scales</text>
<path d="M377,285 L422,285" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="436" y="198" width="328" height="178" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="436" y="198" width="7" height="178" rx="3" fill="#7150A5" stroke="#7150A5"/>
<rect x="457" y="216" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="474" y="239" font-size="19" font-weight="700" text-anchor="middle" style="fill:#7150A5">2</text>
<text x="506" y="240" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">PCA(3)</text>
<text x="460" y="277" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 × 31 → 48 × 3</text>
<text x="460" y="306" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Learn three feature</text>
<text x="460" y="335" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">directions</text>
<path d="M773,285 L818,285" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="832" y="198" width="328" height="178" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="832" y="198" width="7" height="178" rx="3" fill="#007B71" stroke="#007B71"/>
<rect x="853" y="216" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="870" y="239" font-size="19" font-weight="700" text-anchor="middle" style="fill:#007B71">3</text>
<text x="902" y="240" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">PLS model</text>
<text x="856" y="277" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 × 3 → 48 × 1</text>
<text x="856" y="306" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Learn the target</text>
<text x="856" y="335" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">relationship</text>
<rect x="40" y="433" width="1120" height="114" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="433" width="7" height="114" rx="3" fill="#A64C12" stroke="#A64C12"/>
<text x="64" y="475" font-size="23" font-weight="700" text-anchor="start" style="fill:#A64C12">Fit learned operations using training rows only</text>
<text x="64" y="512" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Prediction reuses the saved means, feature directions and model.</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">48 input rows remain. Feature width changes from 31 to 3 before one target prediction per row.</text>
</svg>
