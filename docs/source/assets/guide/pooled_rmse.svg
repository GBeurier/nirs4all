<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
<title id="title">Pooling errors differs from averaging fold RMSE</title><desc id="description">Explicit data: fold 1 residuals [1, 1]; fold 2 residuals [3, 3].</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="690" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Pooling errors differs from averaging fold RMSE</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Explicit data: fold 1 residuals [1, 1]; fold 2 residuals [3, 3].</text>
<rect x="40" y="156" width="545" height="132" rx="10" fill="white" stroke="#D9E2EC"/>
<rect x="40" y="156" width="545" height="44" rx="10" fill="#EAF0F7" stroke="#D9E2EC"/>
<text x="56" y="185" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Held-out fold</text>
<text x="266" y="185" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Residuals</text>
<text x="456" y="185" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">RMSE</text>
<text x="56" y="229" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">Fold 1</text>
<text x="266" y="229" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">1, 1</text>
<text x="456" y="229" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">1</text>
<text x="56" y="273" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">Fold 2</text>
<text x="266" y="273" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">3, 3</text>
<text x="456" y="273" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">3</text>
<rect x="40" y="344" width="545" height="164" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="344" width="7" height="164" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="386" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Average fold RMSE</text>
<text x="64" y="423" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">(1 + 3) / 2 = 2.000</text>
<text x="64" y="452" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Each fold RMSE receives equal weight</text>
<rect x="637" y="156" width="523" height="352" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="637" y="156" width="7" height="352" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="661" y="198" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Pool all squared residuals</text>
<text x="661" y="235" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Residuals: 1, 1, 3, 3</text>
<text x="661" y="264" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Squared errors: 1, 1, 9, 9</text>
<text x="661" y="293" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Mean squared error: 20 / 4 = 5</text>
<text x="661" y="322" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Pooled RMSE: √5 ≈ 2.236</text>
<rect x="40" y="574" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="601" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="627" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Mean fold RMSE = 2.000. Pooled RMSE = 2.236. State which aggregation is reported.</text>
</svg>
