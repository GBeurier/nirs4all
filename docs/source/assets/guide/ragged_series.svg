<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Summarize different-length series into the same columns</title><desc id="description">SequenceSummary keeps one row per sample; statistics are computed separately within each series.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Summarize different-length series into the same columns</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">SequenceSummary keeps one row per sample; statistics are computed separately within each series.</text>
<rect x="40" y="164" width="500" height="176" rx="10" fill="white" stroke="#D9E2EC"/>
<rect x="40" y="164" width="500" height="44" rx="10" fill="#EAF0F7" stroke="#D9E2EC"/>
<text x="56" y="193" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Sample</text>
<text x="176" y="193" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Channel values</text>
<text x="436" y="193" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Length</text>
<text x="56" y="237" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">A</text>
<text x="176" y="237" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">[1, 3]</text>
<text x="436" y="237" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">2</text>
<text x="56" y="281" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">B</text>
<text x="176" y="281" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">[2, 4, 6]</text>
<text x="436" y="281" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">3</text>
<text x="56" y="325" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">C</text>
<text x="176" y="325" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">[0, 2, 4, 6]</text>
<text x="436" y="325" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">4</text>
<rect x="642" y="164" width="518" height="199" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="642" y="164" width="7" height="199" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="666" y="206" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">One channel → five summary columns</text>
<text x="666" y="243" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Mean, std (ddof=0), min, max, length</text>
<text x="666" y="272" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Time coordinates are not used</text>
<text x="666" y="301" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Order and dynamics are not retained</text>
<path d="M548,256 L631,256" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="132" y="410" width="925" height="176" rx="10" fill="white" stroke="#D9E2EC"/>
<rect x="132" y="410" width="925" height="44" rx="10" fill="#EAF0F7" stroke="#D9E2EC"/>
<text x="148" y="439" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Sample</text>
<text x="293" y="439" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Mean</text>
<text x="448" y="439" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Std</text>
<text x="603" y="439" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Min</text>
<text x="748" y="439" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Max</text>
<text x="893" y="439" font-size="19" font-weight="600" text-anchor="start" style="fill:#162C46">Length</text>
<text x="148" y="483" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">A</text>
<text x="293" y="483" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">2</text>
<text x="448" y="483" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">1</text>
<text x="603" y="483" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">1</text>
<text x="748" y="483" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">3</text>
<text x="893" y="483" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">2</text>
<text x="148" y="527" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">B</text>
<text x="293" y="527" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">4</text>
<text x="448" y="527" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">1.633</text>
<text x="603" y="527" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">2</text>
<text x="748" y="527" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">6</text>
<text x="893" y="527" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">3</text>
<text x="148" y="571" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">C</text>
<text x="293" y="571" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">3</text>
<text x="448" y="571" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">2.236</text>
<text x="603" y="571" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">0</text>
<text x="748" y="571" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">6</text>
<text x="893" y="571" font-size="19" font-weight="400" text-anchor="start" style="fill:#162C46">4</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Three variable-length series become a numeric 3 × 5 matrix. Channels must keep their identity.</text>
</svg>
