<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Four repeated scans belong to one physical sample</title><desc id="description">Reshape 120 scans into 30 sample rows while preserving their repetition relation.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Four repeated scans belong to one physical sample</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Reshape 120 scans into 30 sample rows while preserving their repetition relation.</text>
<rect x="40" y="248" width="283" height="186" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="248" width="7" height="186" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="290" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Input</text>
<text x="64" y="327" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">30 physical samples</text>
<text x="64" y="356" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">4 scans per sample</text>
<text x="64" y="385" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">120 scans × 31 features</text>
<rect x="422" y="162" width="738" height="156" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="422" y="162" width="7" height="156" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="446" y="204" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">rep_to_sources · one source for each repeat</text>
<text x="446" y="241" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Sources 0, 1, 2, 3 each have shape 30 × 31</text>
<text x="446" y="270" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Useful for source-local processing or fusion</text>
<rect x="422" y="377" width="738" height="156" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="422" y="377" width="7" height="156" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="446" y="419" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">rep_to_pp · one source with four views</text>
<text x="446" y="456" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Shape: 30 samples × 4 repetitions × 31 features</text>
<text x="446" y="485" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Useful for tracking repeats as feature views</text>
<path d="M331,315 L411,237" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M331,366 L411,451" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">The sample axis has 30 physical samples. Do not evaluate their repeated scans as independent observations.</text>
</svg>
