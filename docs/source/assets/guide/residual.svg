<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">A residual learner adds a correction to a base prediction</title><desc id="description">Use held-out base predictions to learn what the first model has not explained.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">A residual learner adds a correction to a base prediction</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Use held-out base predictions to learn what the first model has not explained.</text>
<rect x="40" y="172" width="328" height="180" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="172" width="7" height="180" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="214" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Base model</text>
<text x="64" y="251" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Base prediction: 10</text>
<text x="64" y="280" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Its OOF errors become</text>
<text x="64" y="309" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">the learner&#x27;s targets</text>
<rect x="436" y="172" width="328" height="180" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="436" y="172" width="7" height="180" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="460" y="214" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Residual learner</text>
<text x="460" y="251" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Predicted correction: +2</text>
<text x="460" y="280" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Weight λ = 0.5</text>
<text x="460" y="309" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Gate = 1 in this</text>
<text x="460" y="338" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">illustration</text>
<rect x="832" y="172" width="328" height="180" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="832" y="172" width="7" height="180" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="856" y="214" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Combined prediction</text>
<text x="856" y="251" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">10 + 0.5 × 1 × 2</text>
<text x="856" y="280" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Final prediction: 11</text>
<path d="M375,255 L426,255" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M771,255 L822,255" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="132" y="421" width="936" height="116" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="132" y="421" width="7" height="116" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="156" y="463" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Why the correction has its own weight</text>
<text x="156" y="500" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">A perfect training correction may be too strong on new samples.</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">The full predictor returns 11, not the base output 10 or the learner output 2 by itself.</text>
</svg>
