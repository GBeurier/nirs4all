<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Read the errors, not just the best score</title><desc id="description">Illustrative observations: 5, 8, 11. Predictions: 4.8, 8.2, 10.9.</desc>
