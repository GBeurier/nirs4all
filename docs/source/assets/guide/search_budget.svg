<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Count the experiments before starting a search</title><desc id="description">Independent choices multiply the number of complete candidate recipes.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Count the experiments before starting a search</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Independent choices multiply the number of complete candidate recipes.</text>
<rect x="40" y="167" width="328" height="154" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="167" width="7" height="154" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="209" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Preprocessing</text>
<text x="64" y="246" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">3 choices</text>
<text x="402" y="255" font-size="38" font-weight="400" text-anchor="middle" style="fill:#4C6278">×</text>
<rect x="436" y="167" width="328" height="154" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="436" y="167" width="7" height="154" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="460" y="209" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Components</text>
<text x="460" y="246" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">4 values</text>
<text x="798" y="255" font-size="38" font-weight="400" text-anchor="middle" style="fill:#4C6278">×</text>
<rect x="832" y="167" width="328" height="154" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="832" y="167" width="7" height="154" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="856" y="209" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Seeds</text>
<text x="856" y="246" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">2 values</text>
<rect x="40" y="376" width="530" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="376" width="7" height="157" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="418" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">24 candidate recipes</text>
<text x="64" y="455" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">3 × 4 × 2 = 24</text>
<text x="64" y="484" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Each has its own fitted state</text>
<rect x="630" y="376" width="530" height="157" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="630" y="376" width="7" height="157" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="654" y="418" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">120 model fits · five folds</text>
<text x="654" y="455" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">24 × 5 = 120 evaluation fits</text>
<text x="654" y="484" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Winner refit and inner tuning add work</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Even this small search needs 120 evaluation fits. Start with a small space and a baseline.</text>
</svg>
