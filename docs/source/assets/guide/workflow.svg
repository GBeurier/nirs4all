<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">From measurements to a prediction you can use</title><desc id="description">Follow one complete experiment before adding tuning, branches or more modalities</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">From measurements to a prediction you can use</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">Follow one complete experiment before adding tuning, branches or more modalities</text>
<rect x="40" y="178" width="208" height="195" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="178" width="7" height="195" rx="3" fill="#1463A0" stroke="#1463A0"/>
<rect x="61" y="196" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="78" y="219" font-size="19" font-weight="700" text-anchor="middle" style="fill:#1463A0">1</text>
<text x="110" y="220" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Load</text>
<text x="64" y="257" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Spectra + lab</text>
<text x="64" y="286" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">targets</text>
<text x="64" y="315" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Same sample IDs</text>
<path d="M252,263 L261,263" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="268" y="178" width="208" height="195" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="268" y="178" width="7" height="195" rx="3" fill="#1463A0" stroke="#1463A0"/>
<rect x="289" y="196" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="306" y="219" font-size="19" font-weight="700" text-anchor="middle" style="fill:#1463A0">2</text>
<text x="338" y="220" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Split</text>
<text x="292" y="257" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Train / validate</text>
<text x="292" y="286" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Keep groups</text>
<text x="292" y="315" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">together</text>
<path d="M480,263 L489,263" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="496" y="178" width="208" height="195" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="496" y="178" width="7" height="195" rx="3" fill="#1463A0" stroke="#1463A0"/>
<rect x="517" y="196" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="534" y="219" font-size="19" font-weight="700" text-anchor="middle" style="fill:#1463A0">3</text>
<text x="566" y="220" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Compare</text>
<text x="520" y="257" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Try recipes</text>
<text x="520" y="286" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Measure held-out</text>
<text x="520" y="315" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">error</text>
<path d="M708,263 L717,263" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="724" y="178" width="208" height="195" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="724" y="178" width="7" height="195" rx="3" fill="#007B71" stroke="#007B71"/>
<rect x="745" y="196" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="762" y="219" font-size="19" font-weight="700" text-anchor="middle" style="fill:#007B71">4</text>
<text x="794" y="220" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Refit</text>
<text x="748" y="257" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fit chosen</text>
<text x="748" y="286" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">recipe</text>
<text x="748" y="315" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Save learned</text>
<text x="748" y="344" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">state</text>
<path d="M936,263 L945,263" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="952" y="178" width="208" height="195" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="952" y="178" width="7" height="195" rx="3" fill="#007B71" stroke="#007B71"/>
<rect x="973" y="196" width="35" height="32" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/>
<text x="990" y="219" font-size="19" font-weight="700" text-anchor="middle" style="fill:#007B71">5</text>
<text x="1022" y="220" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Predict</text>
<text x="976" y="257" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Fresh spectra</text>
<text x="976" y="286" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Return target</text>
<text x="976" y="315" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">units</text>
<rect x="40" y="420" width="520" height="130" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="420" width="7" height="130" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="64" y="462" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Laboratory question</text>
<text x="64" y="499" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">What is the concentration in this sample?</text>
<rect x="600" y="420" width="560" height="130" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="600" y="420" width="7" height="130" rx="3" fill="#A64C12" stroke="#A64C12"/>
<text x="624" y="462" font-size="23" font-weight="700" text-anchor="start" style="fill:#A64C12">Statistical question</text>
<text x="624" y="499" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">How wrong will I be on genuinely new samples?</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">The fitted predictor contains the preprocessing and feature order needed to reproduce predictions.</text>
</svg>
