<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Fit in transformed target units; predict in original units</title><desc id="description">The fitted target transformation is inverted after the model makes a prediction.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243B53" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#64788C" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#162C46}</style>
<rect width="1200" height="720" rx="24" fill="#F3F6FA"/>
<rect x="32" y="32" width="6" height="66" rx="3" fill="#1463A0"/>
<text x="56" y="59" font-size="30" font-weight="700" text-anchor="start" style="fill:#162C46">Fit in transformed target units; predict in original units</text>
<text x="56" y="94" font-size="19" font-weight="400" text-anchor="start" style="fill:#4C6278">The fitted target transformation is inverted after the model makes a prediction.</text>
<rect x="40" y="180" width="342" height="174" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="40" y="180" width="7" height="174" rx="3" fill="#1463A0" stroke="#1463A0"/>
<text x="64" y="222" font-size="23" font-weight="700" text-anchor="start" style="fill:#1463A0">Original target</text>
<text x="64" y="259" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Concentrations: 10, 20, 30</text>
<text x="64" y="288" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Training range: 10 to 30</text>
<rect x="434" y="180" width="326" height="174" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="434" y="180" width="7" height="174" rx="3" fill="#7150A5" stroke="#7150A5"/>
<text x="458" y="222" font-size="23" font-weight="700" text-anchor="start" style="fill:#7150A5">Fit MinMaxScaler</text>
<text x="458" y="259" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Map range to [0, 1]</text>
<text x="458" y="288" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Model sees: 0, 0.5, 1</text>
<rect x="812" y="180" width="348" height="174" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<rect x="812" y="180" width="7" height="174" rx="3" fill="#007B71" stroke="#007B71"/>
<text x="836" y="222" font-size="23" font-weight="700" text-anchor="start" style="fill:#007B71">Model output</text>
<text x="836" y="259" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Predicts 0.6</text>
<text x="836" y="288" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">Still in transformed units</text>
<path d="M389,265 L424,265" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M767,265 L802,265" fill="none" stroke="#64788C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="174" y="406" width="852" height="133" rx="16" fill="white" stroke="#D9E2EC" filter="url(#shadow)"/>
<text x="600" y="449" font-size="23" font-weight="700" text-anchor="middle" style="fill:#007B71">Inverse transform the prediction</text>
<text x="600" y="496" font-size="32" font-weight="600" text-anchor="middle" style="fill:#162C46">10 + 0.6 × (30 − 10) = 22</text>
<rect x="40" y="604" width="1120" height="88" rx="12" fill="white" stroke="#D9E2EC"/>
<text x="60" y="631" font-size="17" font-weight="700" text-anchor="start" style="fill:#007B71">EXPECTED RESULT</text>
<text x="60" y="657" font-size="20" font-weight="400" text-anchor="start" style="fill:#162C46">The user receives 22 in original target units. Reuse the fitted training transformation.</text>
</svg>
